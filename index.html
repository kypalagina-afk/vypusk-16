<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выпуск-16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#17181B; --panel:#212328; --panel2:#2A2D33; --line:#393C43; --line2:#4A4E56;
  --text:#ECE8DF; --muted:#9D9C9A; --dim:#6F6F72;
  --amber:#E3A33C; --amber-soft:rgba(227,163,60,.14);
  --rec:#E0483B; --thread:#B8402F; --ok:#86B58F; --ok-soft:rgba(134,181,143,.14);
  --paper:#ECE5D3; --paper2:#E3DAC4; --ink:#26231E; --ink-muted:#6B6457; --pencil:#5E5A55;
  --felt:#262D33; --sticky:#E4CF85; --wood:#2A2420; --kraft:#B89868;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-serif:"PT Serif",Georgia,serif;
  --f-hand:"Caveat","Segoe Print",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.label{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-family:var(--f-cond);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.02;text-transform:uppercase}
h2{font-family:var(--f-cond);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
h3{font-family:var(--f-cond);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.lead{color:var(--muted);max-width:64ch}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--amber);padding:2px 0 2px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:10px 16px;border-radius:4px;font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1407}
.btn.primary:hover{background:#EDB358}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toggle{border:1px solid var(--line2);background:none;padding:8px 11px;border-radius:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toggle[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.pill{font-family:var(--f-cond);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:10px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--amber-soft);color:var(--amber)}
.pill.none{background:var(--panel2);color:var(--dim)}
.pill.c9{background:#2E3A4A;color:#9EC1E6}
.pill.c16{background:#44302B;color:#EDA894}
.pill.clog{background:#353244;color:#C3B8EA}
.stamp{display:inline-block;font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase;padding:3px 8px;border:2px solid currentColor;border-radius:2px;transform:rotate(-3deg)}
.stamp.ok{color:#3F7A4C}
.stamp.draft{color:#A56A12}
.stamp.big{font-size:18px;padding:5px 14px;color:var(--ok);border-width:3px}
.stamp.hit{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(1.9) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(23,24,27,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-cond);font-weight:700;font-size:19px;letter-spacing:.06em;white-space:nowrap}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec)}
.logo small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0;margin-left:4px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:6px 10px;border:0;background:none;border-radius:4px;font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover:not(:disabled){color:var(--text);background:var(--panel)}
.tab.now{color:var(--ground);background:var(--amber)}
.tab:disabled{color:var(--dim);cursor:default}
.tab svg{width:11px;height:11px}
.topbtn{border:1px solid var(--line2);background:var(--panel);padding:7px 12px;border-radius:4px;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.topbtn:hover{border-color:var(--amber)}
.topbtn .cnt{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--amber-soft);color:var(--amber);font-family:var(--f-mono);font-size:11px}
main{max-width:1220px;margin:0 auto;padding:26px 22px 70px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.back{border:0;background:none;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding:0;margin-bottom:8px}
.back:hover{color:var(--amber)}
.drawer{position:fixed;right:18px;top:62px;z-index:40;width:min(380px,calc(100vw - 36px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:16px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.matrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;background:var(--ground);border:1px solid var(--line);border-radius:5px}
.matrow .t{font-size:14px}
.appear{animation:appear .5s ease-out both}
@keyframes appear{0%{transform:translateY(8px) scale(.97);opacity:.2}100%{transform:none;opacity:1}}

/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;min-height:560px}
.shelves{position:relative;border-radius:6px;overflow:hidden;height:460px;background:
  repeating-linear-gradient(180deg,transparent 0 108px,#0F1012 108px 122px),
  linear-gradient(90deg,#1C1D20,#232326 50%,#1B1C1F);border:1px solid var(--line)}
.shelves .binders{position:absolute;inset:14px 18px;display:grid;grid-template-rows:repeat(4,108px);row-gap:14px}
.shelves .binders div{display:flex;gap:6px;align-items:end}
.shelves .binders span{display:block;width:26px;background:#2F3033;border-radius:2px 2px 0 0;box-shadow:inset -3px 0 0 rgba(0,0,0,.25)}
.box{position:absolute;left:50%;bottom:34px;width:300px;height:190px;margin-left:-150px}
.box .body{position:absolute;inset:40px 0 0;background:linear-gradient(180deg,#B08F5F,#8E7148);border-radius:3px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.box .body::before{content:"";position:absolute;left:0;right:0;top:48%;height:22px;background:rgba(236,220,160,.55)}
.box .body b{position:absolute;right:22px;bottom:18px;font-family:var(--f-hand);font-weight:600;font-size:46px;color:#2A2118;transform:rotate(-4deg)}
.box .body em{position:absolute;left:20px;bottom:22px;font-family:var(--f-hand);font-style:normal;font-size:21px;color:#3A2E20;opacity:.8}
.box .lid{position:absolute;left:-8px;right:-8px;top:18px;height:34px;background:linear-gradient(180deg,#C2A06C,#9E7F52);border-radius:3px;transform-origin:10% 100%;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity 1s}
.box.open .lid{transform:translate(-40px,-70px) rotate(-24deg);opacity:.9}
.box .peek{position:absolute;left:30px;right:30px;top:44px;height:30px;display:flex;gap:10px;opacity:0;transition:opacity .8s .5s}
.box.open .peek{opacity:1}
.box .peek i{flex:1;background:var(--paper);transform:translateY(-12px) rotate(-3deg)}
.box .peek i:nth-child(2){background:#2E3F55;transform:translateY(-18px) rotate(4deg)}
.box .peek i:nth-child(3){background:#1C1C1E;transform:translateY(-8px) rotate(-1deg)}
.dialog{display:grid;gap:14px}
.line{font-family:var(--f-serif);font-size:21px;line-height:1.45;max-width:30ch}
.line.appear{animation-duration:.6s}
.speaker{font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase;color:var(--amber)}
.stage{font-style:italic;color:var(--muted);font-size:15px;max-width:44ch}

/* ---------- desk ---------- */
.desk-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.desk{position:relative;border-radius:8px;padding:26px;min-height:560px;background:
  radial-gradient(900px 420px at 50% 0%,rgba(255,226,170,.08),transparent 70%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),
  linear-gradient(180deg,#312923,#241E1A);border:1px solid #3A322B;box-shadow:inset 0 0 90px rgba(0,0,0,.5)}
.desk-label{position:absolute;right:22px;top:16px;font-family:var(--f-hand);font-size:26px;color:rgba(236,220,190,.35)}
.things{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px;margin-top:22px}
.thing{border:0;background:none;padding:0;display:grid;justify-items:center;gap:10px;color:var(--text);text-align:center}
.thing .obj{height:170px;width:100%;display:grid;place-items:center;transition:transform .2s}
.thing:hover .obj{transform:translateY(-4px) rotate(-1deg)}
.thing .cap{font-family:var(--f-cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.thing .opt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:-6px}
.o-diary{width:128px;height:160px;border-radius:3px 8px 8px 3px;background:
  radial-gradient(40px 30px at 30% 70%,rgba(160,190,210,.25),transparent 70%),
  radial-gradient(60px 44px at 70% 30%,rgba(10,20,30,.35),transparent 70%),
  linear-gradient(90deg,#1E2A38 0 10px,#2E4056 10px);box-shadow:0 12px 20px rgba(0,0,0,.5);position:relative;transform:rotate(-5deg)}
.o-diary::after{content:"";position:absolute;right:18px;top:0;bottom:0;width:6px;background:#15181C}
.o-tape{width:188px;height:118px;border-radius:7px;background:linear-gradient(180deg,#2B2B2E,#19191B);box-shadow:0 12px 20px rgba(0,0,0,.5);position:relative;transform:rotate(3deg)}
.o-tape .lbl{position:absolute;left:12px;right:12px;top:10px;height:44px;background:var(--paper);border-radius:2px;font-family:var(--f-hand);font-weight:600;font-size:22px;color:#A2291D;display:grid;place-items:center;line-height:1}
.o-tape .holes{position:absolute;left:36px;right:36px;bottom:16px;height:32px;display:flex;justify-content:space-between}
.o-tape .holes i{width:32px;height:32px;border-radius:50%;background:#0B0B0C;box-shadow:inset 0 0 0 8px #3A3A3D}
.o-print{width:132px;height:166px;position:relative}
.o-print i{position:absolute;inset:0;background:var(--paper);box-shadow:0 8px 14px rgba(0,0,0,.35)}
.o-print i:nth-child(1){transform:rotate(-7deg);background:#DCD3BE}
.o-print i:nth-child(2){transform:rotate(4deg)}
.o-print i:nth-child(2)::before{content:"";position:absolute;inset:18px 14px;background:repeating-linear-gradient(180deg,#B9B09C 0 2px,transparent 2px 10px)}
.o-print i:nth-child(2)::after{content:"";position:absolute;left:40px;top:52px;width:36px;height:18px;border:2px solid #6A665F;border-radius:50%;transform:rotate(-8deg)}
.o-laptop{width:190px;height:128px;position:relative}
.o-laptop .scr{position:absolute;left:14px;right:14px;top:0;height:104px;background:#101113;border:6px solid #2B2D31;border-radius:6px 6px 0 0;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:#8FB7C9}
.o-laptop .scr::after{content:"поиск: Лиза Воронцова_";opacity:.85}
.o-laptop .base{position:absolute;left:0;right:0;bottom:0;height:14px;background:#3A3C41;border-radius:0 0 8px 8px}
.o-photo{width:120px;height:140px;background:#F1ECE1;padding:8px 8px 26px;box-shadow:0 10px 16px rgba(0,0,0,.45);transform:rotate(6deg)}
.o-photo i{display:block;height:100%;background:
  radial-gradient(9px 11px at 38% 42%,#3C3A38 95%,transparent),radial-gradient(9px 11px at 63% 40%,#3C3A38 95%,transparent),
  radial-gradient(20px 34px at 38% 82%,#3C3A38 95%,transparent),radial-gradient(20px 34px at 63% 80%,#3C3A38 95%,transparent),
  linear-gradient(180deg,#8C918F,#6E6B64);filter:sepia(.35)}
.o-slip{width:130px;height:74px;background:#E9E2CF;clip-path:polygon(0 6%,20% 0,45% 5%,70% 0,100% 4%,98% 100%,70% 94%,40% 100%,12% 95%,0 100%);display:grid;place-items:center;font-family:var(--f-hand);font-size:20px;color:#2F2A24;transform:rotate(-4deg);box-shadow:0 8px 12px rgba(0,0,0,.35)}
.need{display:grid;gap:8px}
.need li{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.need{margin:0;padding:0}
.box-side{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px}

/* ---------- documents & tasks ---------- */
.scene{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.paper{background:var(--paper);color:var(--ink);border-radius:2px;padding:26px 28px;box-shadow:0 14px 34px rgba(0,0,0,.4);position:relative}
.paper .doc-title{font-family:var(--f-cond);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:16px}
.doctext{font-family:var(--f-serif);font-size:18px;line-height:1.85}
.hand{font-family:var(--f-hand);font-size:25px;line-height:1.35;color:#24324A}
.notebook{display:grid;grid-template-columns:200px minmax(0,1fr);background:#E8E1CE;border-radius:4px 10px 10px 4px;box-shadow:0 16px 36px rgba(0,0,0,.45);overflow:hidden;position:relative;min-height:470px}
.notebook::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(160px 110px at 78% 22%,rgba(90,110,140,.20),transparent 70%),
  radial-gradient(120px 90px at 30% 80%,rgba(90,110,140,.16),transparent 70%),
  radial-gradient(90px 70px at 62% 70%,rgba(120,100,70,.14),transparent 70%)}
.nb-index{border-right:2px solid #CFC5AE;padding:22px 14px;display:grid;align-content:start;gap:8px;background:#E1D9C4}
.nb-entry{border:1px solid transparent;background:none;text-align:left;padding:8px 10px;border-radius:3px;color:var(--ink);display:grid;gap:3px}
.nb-entry:hover:not(:disabled){border-color:#BDB29A}
.nb-entry[aria-current="true"]{background:#F2ECDD;border-color:#BDB29A}
.nb-entry:disabled{opacity:.45;cursor:default}
.nb-entry b{font-family:var(--f-hand);font-size:22px;font-weight:600;line-height:1}
.nb-page{padding:26px 30px;background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(90,120,160,.28) 33px 34px);background-position:0 12px}
.nb-page .hand{line-height:34px;font-size:24px}
.wd{white-space:nowrap;border-radius:2px;transition:background .2s}
.wd.hl{background:rgba(227,163,60,.38);box-shadow:0 0 0 3px rgba(227,163,60,.38)}
input.lt{width:1.15em;text-align:center;font:inherit;color:#8A2A1E;background:rgba(255,255,255,.55);border:0;border-bottom:2px dashed #7C6B55;padding:0;margin:0 1px;border-radius:2px}
input.lt:focus{outline:2px solid var(--amber);background:#fff}
.gap-slot{display:inline-block;min-width:.8em;text-align:center;color:#8A2A1E;border-bottom:2px dashed #7C6B55}
.pick{display:inline-flex;gap:2px;vertical-align:2px;margin:0 2px}
.pick button{font-family:var(--f-mono);font-size:13px;line-height:1;padding:4px 6px;border:1px solid #9C8F78;background:rgba(255,255,255,.5);color:var(--ink);border-radius:3px}
.pick button[aria-pressed="true"]{background:#2E4056;color:#F1ECE1;border-color:#2E4056}
.task-side{display:grid;gap:14px}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px}
.qopts{display:grid;gap:6px}
.qopt{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--ground);text-align:left;font-size:14px}
.qopt[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.qopt.hl{box-shadow:0 0 0 2px var(--amber)}
.probe{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.probe:last-child{border-bottom:0}
.probe .w{font-family:var(--f-serif);font-size:20px}
.fb{border:1px solid var(--line2);background:var(--panel2);border-radius:4px;padding:13px 14px;display:grid;gap:10px}
.fb h4{font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--amber)}
.hint{border-left:2px solid var(--amber);padding:4px 0 4px 12px;display:grid;gap:8px}
.hint .lvl{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hint p{font-size:15px}
.confirmed{display:grid;gap:10px;justify-items:start}
.echo{font-size:17px;line-height:1.9;background:var(--ground);border-radius:3px;padding:8px 12px}
.echo .hl{background:rgba(227,163,60,.25);border-radius:2px;padding:1px 2px}
.echo .gap{display:inline-block;min-width:14px;height:1.15em;vertical-align:-2px;margin:0 2px;border:1.5px solid var(--amber);border-radius:2px}
.echo .miss{display:inline-block;padding:0 5px;margin:0 2px;border:1px dashed var(--amber);border-radius:2px;font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.typo{font-size:13px;color:var(--muted)}
.draftnote{font-size:13px;color:var(--amber)}

/* memo */
.memo ol{margin:14px 0 0;padding-left:22px;display:grid;gap:14px;font-family:var(--f-serif);font-size:17px;line-height:1.6}
.spot{display:inline-block;min-width:16px;height:1.25em;vertical-align:-3px;text-align:center;border:2px solid #6A665F;border-radius:50%;margin:0 2px;color:var(--ink);font-weight:700;line-height:1}
.spot.hl{border-color:#C07A12;background:rgba(227,163,60,.35)}
.margin-note{display:block;text-align:right;margin:2px 6px -6px 0;transform:rotate(-3deg);font-family:var(--f-hand);font-size:24px;line-height:1.1;color:var(--pencil)}
.decide{display:grid;gap:10px}
.decide-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--ground)}
.decide-row.hl{box-shadow:0 0 0 2px var(--amber)}
.decide-row .n{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;justify-self:start}
.seg button{border:0;background:none;padding:7px 11px;font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ground)}
.seg button:disabled{cursor:default}
.csent{font-family:var(--f-serif);font-size:17px;grid-column:1/-1}
.csent .q{display:inline-block;min-width:22px;text-align:center;color:var(--amber);font-family:var(--f-mono)}

/* photo & slip */
.photo-big{width:min(420px,100%);background:#F1ECE1;padding:16px 16px 60px;box-shadow:0 16px 36px rgba(0,0,0,.5);transform:rotate(-2deg);position:relative;border:0;color:var(--ink)}
.photo-big .img{aspect-ratio:4/3;background:
  radial-gradient(18px 22px at 40% 38%,#3C3A38 95%,transparent),radial-gradient(18px 22px at 60% 36%,#3C3A38 95%,transparent),
  radial-gradient(44px 80px at 40% 88%,#3C3A38 95%,transparent),radial-gradient(44px 80px at 60% 86%,#3C3A38 95%,transparent),
  linear-gradient(0deg,#5E5B55 0 18%,transparent 18%),repeating-linear-gradient(90deg,#77736C 0 26px,#6F6B64 26px 52px);filter:sepia(.4) contrast(.9)}
.photo-big .back-side{position:absolute;inset:16px 16px 60px;background:#EDE6D6;display:grid;place-items:center;font-family:var(--f-hand);font-size:36px;color:#24324A}
.photo-big .flip{position:absolute;left:16px;bottom:18px;font-family:var(--f-mono);font-size:11px;color:var(--ink-muted)}
.slip-big{width:min(460px,100%);padding:40px 34px;background:#E9E2CF;clip-path:polygon(0 4%,20% 0,45% 3%,70% 0,100% 3%,98% 100%,70% 96%,40% 100%,12% 97%,0 100%);font-family:var(--f-hand);font-size:34px;color:#2F2A24;line-height:1.25;transform:rotate(-2deg)}

/* tape deck */
.deck{background:linear-gradient(180deg,#2B2C30,#1C1D20);border:1px solid #3B3D42;border-radius:10px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.45);display:grid;gap:14px}
.deck-win{position:relative;height:190px;border-radius:6px;background:#0E0F10;border:1px solid #333;display:grid;place-items:center;overflow:hidden}
.cass{width:300px;height:160px;border-radius:10px;background:linear-gradient(180deg,#303033,#1D1D20);position:relative}
.cass .lbl{position:absolute;left:18px;right:18px;top:12px;height:46px;background:var(--paper);border-radius:3px;font-family:var(--f-hand);font-weight:600;font-size:30px;color:#A2291D;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.cass .lbl small{font-family:var(--f-mono);font-size:11px;color:#6B6457}
.reel{position:absolute;bottom:22px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#111 0 9px,#4A3B2B 10px 22px,#2A2118 23px 30px,#101010 31px)}
.reel::after{content:"";position:absolute;inset:18px;border-radius:50%;background:conic-gradient(#DCD6C8 0 30deg,transparent 30deg 120deg,#DCD6C8 120deg 150deg,transparent 150deg 240deg,#DCD6C8 240deg 270deg,transparent 270deg)}
.reel.l{left:52px}.reel.r{right:52px}
.deck.playing .reel::after{animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.deck-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.counter{font-family:var(--f-mono);font-size:22px;letter-spacing:.18em;background:#0B0B0C;color:#E9E2CF;padding:4px 10px;border-radius:3px;border:1px solid #333}
.vu{display:flex;gap:3px;align-items:end;height:26px}
.vu i{width:5px;height:3px;background:var(--amber);border-radius:1px;transition:height .09s}
.tcap{min-height:40px;font-family:var(--f-mono);font-size:13px;color:#C9C4BA;text-align:center;padding:8px;border:1px dashed #3B3D42;border-radius:4px}
.keys{display:flex;gap:8px;flex-wrap:wrap}
.key{border:1px solid #4A4C52;background:linear-gradient(180deg,#3A3C41,#2A2B2F);border-radius:4px;padding:10px 12px;font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase;box-shadow:0 3px 0 #111}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #111}
.key.on{color:var(--amber);border-color:var(--amber)}
.key:disabled{opacity:.4;cursor:not-allowed}
.fragtabs{display:flex;gap:6px;flex-wrap:wrap}
textarea.input{width:100%;min-height:118px;resize:vertical;background:var(--ground);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:12px 14px;font-family:var(--f-body);font-size:18px;line-height:1.5}
.quote-ok{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 18px;font-family:var(--f-serif);font-size:19px;line-height:1.45;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.locked{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:4px;font-size:14px}

/* browser */
.browser{border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#F3F1EC;color:#1F2023}
.bbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#2A2C31;color:#DDD}
.bbar .dots{display:flex;gap:5px}.bbar .dots i{width:9px;height:9px;border-radius:50%;background:#55585E}
.bbar .url{flex:1;background:#1B1C1F;border-radius:4px;padding:5px 10px;font-family:var(--f-mono);font-size:12px;color:#BFC3C9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bgrid{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:560px}
.bside{border-right:1px solid #DDD8CD;padding:14px;display:grid;align-content:start;gap:10px;background:#EAE6DD}
.bsearch{font-family:var(--f-mono);font-size:13px;background:#fff;border:1px solid #CFC9BC;border-radius:4px;padding:8px 10px}
.bres{border:1px solid transparent;background:none;text-align:left;padding:9px 10px;border-radius:4px;display:grid;gap:2px;color:#1F2023}
.bres:hover{background:#F6F3EC}
.bres[aria-current="true"]{background:#fff;border-color:#CFC9BC}
.bres b{font-size:14px;color:#1C3E78;font-weight:600}
.bres small{font-family:var(--f-mono);font-size:11px;color:#6A675F}
.bpage{padding:24px 28px;display:grid;gap:14px;align-content:start}
.bpage .src{font-family:var(--f-mono);font-size:12px;color:#6A675F}
.bpage h2{text-transform:none;font-family:var(--f-serif);font-weight:700;font-size:28px;letter-spacing:0;color:#1F2023}
.bpage p{font-size:16px;line-height:1.6;max-width:64ch}
.bpage blockquote{margin:0;border-left:3px solid #B8402F;padding:4px 0 4px 14px;font-family:var(--f-serif);font-size:18px}
.profile{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ava{width:72px;height:72px;border-radius:50%;background:linear-gradient(160deg,#9AA0A8,#5E636B);display:grid;place-items:center;color:#fff;font-family:var(--f-cond);font-weight:700;font-size:24px}
.post{border:1px solid #DDD8CD;border-radius:6px;background:#fff;padding:14px 16px;display:grid;gap:8px}
.post .d{font-family:var(--f-mono);font-size:11px;color:#6A675F}
.post .c{border-top:1px solid #EEE9DF;padding-top:8px;font-size:14px;display:grid;gap:4px}
.post .c b{color:#1C3E78}
.video{aspect-ratio:16/9;max-width:620px;background:linear-gradient(135deg,#1A1B1E,#3A2A26);border-radius:6px;display:grid;place-items:center;color:#F3EDE2;position:relative;overflow:hidden}
.video h3{font-family:var(--f-cond);font-size:28px;text-align:center;padding:0 30px;line-height:1.05;text-shadow:0 2px 12px #000}
.video .play{position:absolute;left:18px;bottom:16px;font-family:var(--f-mono);font-size:12px;color:#ddd}
.caps{display:grid;gap:10px;max-width:680px}
.capline{border:1px solid #DDD8CD;border-radius:6px;background:#fff;padding:10px 12px;display:grid;gap:8px}
.capline.hl{box-shadow:0 0 0 3px rgba(227,163,60,.7)}
.capline .ts{font-family:var(--f-mono);font-size:11px;color:#6A675F}
.capwords{font-size:17px;line-height:1.9}
.capwords button{border:0;background:none;padding:1px 2px;border-radius:3px;color:#1F2023;font-size:17px}
.capwords button:hover{background:#F1E6CC}
.capwords button[aria-pressed="true"]{background:#F2D38E;box-shadow:inset 0 -2px 0 #B8402F}
.capctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.capctl .chipb{border:1px solid #CFC9BC;background:#F6F3EC;border-radius:14px;padding:4px 10px;font-size:13px;color:#1F2023}
.capctl .chipb[aria-pressed="true"]{background:#1F2023;color:#fff;border-color:#1F2023}
.capctl input{font:inherit;font-size:15px;border:1px solid #CFC9BC;border-radius:4px;padding:5px 8px;width:170px;color:#1F2023;background:#fff}
.browser .fb{background:#FFF8E8;border-color:#E0C58A;color:#1F2023}
.browser .fb h4{color:#9A5B06}
.browser .hint p{color:#1F2023}
.browser .hint .lvl{color:#6A675F}

/* board */
.board-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.board{position:relative;height:760px;border-radius:6px;overflow:hidden;background:
  radial-gradient(1200px 500px at 30% 0%,rgba(255,255,255,.05),transparent 60%),
  repeating-linear-gradient(35deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),var(--felt);
  border:1px solid var(--line);box-shadow:inset 0 0 80px rgba(0,0,0,.45)}
.board-scroll{overflow-x:auto;border-radius:6px}
.board svg.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board svg path.new{stroke-dasharray:900;stroke-dashoffset:900;animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card{position:absolute;border:0;padding:0;text-align:left;color:var(--ink);transition:box-shadow .15s}
.card .pin{position:absolute;left:50%;top:-5px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#9B3A2C;box-shadow:0 2px 3px rgba(0,0,0,.5),inset -2px -2px 0 rgba(0,0,0,.25);z-index:2}
.person{width:128px;background:#F1ECE1;padding:6px 6px 8px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.person .ph{height:78px;display:grid;place-items:center;background:linear-gradient(160deg,#5B5F66,#2F3237);color:#E5E1D8;font-family:var(--f-cond);font-weight:700;font-size:30px;position:relative}
.person .ph small{position:absolute;right:5px;bottom:3px;font-family:var(--f-mono);font-weight:400;font-size:9.5px;color:#CFCAC0}
.nm{font-family:var(--f-cond);font-weight:700;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;margin-top:5px;line-height:1.1}
.sb{font-size:11px;color:var(--ink-muted);line-height:1.25;margin-top:2px}
.kind{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.mystery{width:150px;background:var(--kraft);padding:9px 11px 10px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.mystery .big{font-family:var(--f-hand);font-weight:600;font-size:30px;line-height:1;color:#2A1F14}
.mystery .sb{color:#4A3A26}
.mystery .kind{color:#5A4630}
.event{width:140px;background:#F1ECE1;padding:8px 10px 9px;box-shadow:0 8px 18px rgba(0,0,0,.45);border-top:5px solid #7C3A2D}
.event .date{font-family:var(--f-cond);font-weight:700;font-size:22px;color:#7C3A2D;line-height:1;margin-top:3px}
.ev{width:190px;background:var(--paper);padding:9px 11px 9px;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.ev .src{font-family:var(--f-mono);font-size:10px;color:var(--ink-muted);margin-bottom:4px}
.ev .qt{font-family:var(--f-serif);font-size:13px;line-height:1.3}
.ev .stamp{margin-top:6px;font-size:9.5px;padding:1px 5px}
.ev.draft{background:#DCD3BD;outline:2px dashed #A56A12;outline-offset:-5px}
.card.sel{box-shadow:0 0 0 3px var(--amber),0 10px 22px rgba(0,0,0,.5)}
.card:hover{box-shadow:0 0 0 2px rgba(227,163,60,.7),0 10px 22px rgba(0,0,0,.5)}
.tag{position:absolute;transform:translate(-50%,-50%);background:#F1ECE1;color:#5C1E14;font-family:var(--f-hand);font-weight:600;font-size:19px;line-height:1;padding:3px 8px 4px;border:0;box-shadow:0 3px 8px rgba(0,0,0,.4);white-space:nowrap;z-index:3}
.tag small{display:block;font-family:var(--f-mono);font-size:9px;color:var(--ink-muted);font-weight:400;margin-top:2px;text-align:center}
.tag.draft small{color:#A56A12}
.sticky{position:absolute;right:16px;bottom:16px;width:220px;background:var(--sticky);color:#3B3113;padding:12px 14px 14px;font-family:var(--f-hand);font-size:19px;line-height:1.15;box-shadow:0 10px 20px rgba(0,0,0,.4);transform:rotate(2deg);z-index:4}
.sticky b{font-family:var(--f-cond);font-size:11px;letter-spacing:.1em;display:block;margin-bottom:4px;color:#6B5A1E}
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,92%);max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:16px;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.6);display:grid;gap:12px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--ground);text-align:left;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.own{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--text);font:inherit;font-size:14px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:3px 0}
.chk input{accent-color:var(--amber);margin-top:3px}
.aside{display:grid;gap:16px}
.aside .box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px}
.aside ol{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:14px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);padding:7px 12px;border-radius:4px;font-size:13px;z-index:12}

/* facts, version, end */
.facts{display:grid;gap:10px}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.fact .st{font-family:var(--f-serif);font-size:17px;line-height:1.35}
.fact .src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.fact .why{grid-column:1/-1;font-size:14px;border-left:2px solid var(--amber);padding:2px 0 2px 12px;color:#E2D6BF}
.fact .why b{font-family:var(--f-cond);letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;color:var(--amber);display:block}
.fact.good{border-color:rgba(134,181,143,.45)}
.ver{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.form{display:grid;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--ground);padding:6px 10px;border-radius:14px;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);color:#F3C77A}
.end{min-height:520px;display:grid;place-items:center;text-align:center}
.end .q{font-family:var(--f-serif);font-size:clamp(34px,5vw,60px);line-height:1.1;max-width:18ch;margin:18px auto}
.end .sub{color:var(--muted);max-width:52ch;margin:0 auto 26px}

/* archive */
.arch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.lawyer{background:var(--paper);color:var(--ink);border-radius:3px;padding:18px 20px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lawyer p{font-family:var(--f-serif);font-size:15px}
.errs{display:grid;gap:12px}
.err{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px}
.err-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.err dl{margin:0;display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 14px}
.err dt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:3px}
.err dd{margin:0;font-size:14.5px}
.err dd.your{font-family:var(--f-serif);font-size:16px;color:#E7C9B6}
.err dd.right{font-family:var(--f-serif);font-size:16px;color:#CFE3D2}
.err dd.locked-a{color:var(--muted);font-style:italic}
.err .warn{font-size:13.5px;color:var(--amber);border:1px dashed rgba(227,163,60,.5);border-radius:4px;padding:7px 10px}
.empty{padding:22px;border:1px dashed var(--line2);border-radius:6px;color:var(--muted)}
.fixlist{display:grid;gap:10px;max-width:780px}
.seg-tabs{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg-tabs button{border:0;background:none;padding:9px 14px;font-family:var(--f-cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.seg-tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}

@media (max-width:980px){
  .intro,.desk-wrap,.scene,.board-wrap,.ver,.arch,.bgrid{grid-template-columns:1fr}
  .things{grid-template-columns:repeat(2,minmax(0,1fr))}
  .notebook{grid-template-columns:1fr}.nb-index{grid-auto-flow:column;overflow-x:auto;border-right:0;border-bottom:2px solid #CFC5AE}
  .board{min-width:880px}
  .err dl{grid-template-columns:1fr}
  .shelves{height:360px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* =====================================================================
   ВЫПУСК-16 · СТИЛИ ОБЩЕЙ ИГРЫ
   Доска с масштабом, эпизоды, письмо, сортировка, скан, видеоинтервью.
   Подключается после styles.css и переопределяет старую доску.
   ===================================================================== */

/* доска: масштаб, панорама, перетаскивание */
.board-ui{position:relative}
.board-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.board-tools .zoom button{min-width:38px;font-size:15px}
.tools-hint{margin-left:auto}
.board-view{position:relative;height:min(74vh,800px);overflow:auto;border-radius:6px;border:1px solid var(--line);touch-action:none;cursor:grab;
  background:radial-gradient(1200px 500px at 30% 0%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(35deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),var(--felt);
  box-shadow:inset 0 0 80px rgba(0,0,0,.45)}
.board-view.panning{cursor:grabbing}
.board-space{position:relative}
.board{position:absolute;left:0;top:0;transform-origin:0 0;height:auto;overflow:visible;background:none;border:0;border-radius:0;box-shadow:none}
.board svg.threads{position:absolute;left:0;top:0;width:auto;height:auto;pointer-events:none;overflow:visible}
.card{transform:rotate(var(--rot,0deg));user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.card.appear{animation:cardIn .5s ease-out both}
@keyframes cardIn{0%{opacity:.2;transform:rotate(var(--rot,0deg)) translateY(10px) scale(.96)}100%{opacity:1;transform:rotate(var(--rot,0deg))}}
.card.dragging{transform:rotate(0deg) scale(1.03);z-index:6;box-shadow:0 18px 34px rgba(0,0,0,.55)!important;transition:none}
.card.dim{opacity:.28}
.tag.dim{opacity:.3}
.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.person,.mystery,.event,.ev,.place{padding-bottom:14px}
.eptag{position:absolute;right:6px;bottom:-9px;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;background:var(--ground);color:var(--muted);padding:1px 5px;border-radius:8px;border:1px solid var(--line)}
.place{width:170px;background:#DDE3E0;padding:0 0 14px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.place .map{height:58px;position:relative;background:linear-gradient(90deg,transparent 46%,#F4F1EA 46% 54%,transparent 54%),linear-gradient(0deg,transparent 58%,#F4F1EA 58% 66%,transparent 66%),linear-gradient(135deg,#B9C4BE,#9FAEA7)}
.place .map::after{content:"16";position:absolute;left:18%;top:14%;width:34px;height:24px;display:grid;place-items:center;background:#7C3A2D;color:#F4EDE2;font-family:var(--f-cond);font-weight:700;font-size:14px}
.place .body{padding:6px 9px 0}
.board-ui .sticky{position:absolute;right:18px;bottom:18px;top:auto;z-index:8;pointer-events:none}
#popHost{position:absolute;inset:44px 0 0 0;pointer-events:none;z-index:20}
#popHost .pop{pointer-events:auto}
.supports{max-height:210px;overflow:auto}

/* выпуски, контекст, новые предметы стола */
.eplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:900px}
.epcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:10px;justify-items:start}
.epcard.locked{opacity:.55}
.logo small{cursor:pointer;border:0;background:none}
.logo small:hover{color:var(--amber)}
.context{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;background:var(--amber-soft);border:1px solid rgba(227,163,60,.5);border-radius:6px;padding:12px 16px;margin-bottom:16px}
.context p{font-family:var(--f-serif);font-size:16px}
.thing.is-locked{cursor:default;opacity:.6}
.thing.is-locked .obj{filter:grayscale(.6)}
.o-mail{width:170px;height:118px;background:linear-gradient(180deg,#E9E3D3,#D8D0BC);position:relative;box-shadow:0 10px 18px rgba(0,0,0,.45);transform:rotate(-3deg)}
.o-mail i{position:absolute;inset:0;background:linear-gradient(155deg,transparent 49%,#BFB59E 50%,transparent 51%),linear-gradient(25deg,transparent 49%,#BFB59E 50%,transparent 51%)}
.o-mail span{position:absolute;right:-10px;top:-10px;background:var(--rec);color:#fff;font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:10px}
.o-camera{width:170px;height:110px;border-radius:8px;background:linear-gradient(180deg,#2E3034,#1A1B1E);position:relative;box-shadow:0 10px 18px rgba(0,0,0,.45)}
.o-camera i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle,#4B6A80 0 8px,#0B0B0C 9px 22px,#3A3C41 23px)}
.o-camera b{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:10px;color:var(--rec)}
.phone-scene{display:grid;place-items:center}
.phone{width:210px;height:380px;border-radius:30px;background:#0C0D0F;border:6px solid #2A2C31;box-shadow:0 30px 60px rgba(0,0,0,.6);padding:14px}
.phone .scr{height:100%;border-radius:20px;background:linear-gradient(180deg,#1E2A35,#12161B);display:grid;align-content:center;justify-items:center;gap:10px;text-align:center;color:#E6EDF2}
.phone .scr b{font-family:var(--f-cond);font-size:22px;letter-spacing:.03em}
.phone .wave{display:flex;gap:3px;height:28px;align-items:center}
.phone .wave i{width:4px;height:5px;background:var(--ok);border-radius:2px;animation:wave 1.1s ease-in-out infinite}
.phone .wave i:nth-child(odd){animation-delay:.3s}
.phone .wave i:nth-child(3n){animation-delay:.6s}
@keyframes wave{0%,100%{height:5px}50%{height:24px}}

/* письмо и вычитка */
.letter-scene{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.mail{background:#F3F1EC;color:#1F2023;border-radius:8px;padding:18px 20px;display:grid;gap:12px;align-content:start;border:1px solid var(--line2)}
.mail .fwd{background:#E6E1D6;border-radius:4px;padding:8px 10px;color:#5A574F}
.mail .mhead{display:grid;gap:3px;border-bottom:1px solid #DDD8CD;padding-bottom:10px}
.mail .mhead b{font-size:18px}
.mail p{font-size:15.5px;line-height:1.55}
.mail .attach{color:#1C3E78}
.mail .reply{border-left:3px solid #BDB29A;padding:4px 0 4px 12px;color:#4A4740}
.slot{display:inline-grid;place-items:center;min-width:22px;height:24px;vertical-align:-3px;margin:0 2px;padding:0 4px;border:1.5px dashed #9C8F78;border-radius:4px;background:rgba(255,255,255,.55);color:#A56A12;font-family:var(--f-mono);font-size:15px;font-weight:600;line-height:1}
.slot.on{border-style:solid;border-color:#2E4056;color:#2E4056;background:#fff}
.slot.off{border-style:solid;color:#8E8574}
.slot.hl{box-shadow:0 0 0 3px rgba(227,163,60,.7)}
.paper-note{font-family:var(--f-serif);font-size:15px;background:#FFF6DE;color:var(--ink);border-left:3px solid var(--amber);padding:8px 12px;margin-top:6px}

/* сортировка орфограмм */
.sortbox{display:grid;gap:8px;margin-top:16px}
.sortrow{display:grid;grid-template-columns:minmax(120px,auto) auto minmax(0,1fr);gap:8px 12px;align-items:center;padding:8px 10px;border:1px solid #CFC5AE;border-radius:5px;background:rgba(255,255,255,.45)}
.sortrow.hl{box-shadow:0 0 0 3px rgba(227,163,60,.6)}
.sortrow .w{font-family:var(--f-serif);font-size:19px;color:var(--ink)}
.bins{display:flex;flex-wrap:wrap;gap:4px}
.bins button{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border:1px solid #9C8F78;background:rgba(255,255,255,.6);color:var(--ink);border-radius:3px}
.bins button[aria-pressed="true"]{background:#2E4056;color:#F1ECE1;border-color:#2E4056}

/* скан документа и список финалистов */
.scan{background:#fff;border:1px solid #CFC9BC;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:22px 26px;display:grid;gap:4px;max-width:620px;font-family:var(--f-serif);filter:contrast(.92);transform:rotate(-.6deg)}
.scan b{font-size:20px;letter-spacing:.2em;text-align:center}
.scan span{text-align:center;font-size:14px;color:#3A3833}
.scan .sign{margin-top:18px;display:flex;align-items:end;gap:14px;justify-content:flex-end}
.scan .sign span{font-size:13px}
.scan .sign i{font-family:var(--f-hand);font-size:30px;color:#2A3A6A;transform:rotate(-6deg)}
.scan .sign em{font-family:var(--f-mono);font-size:10px;color:#8A857B}
.flist{border-collapse:collapse;width:100%;max-width:720px;font-size:15px}
.flist td{padding:10px 8px;border-bottom:1px solid #DDD8CD}
.removed{color:#9A2A1E;font-weight:600}

/* архив: фильтр; финал: склейка */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 18px}
.deck.mini{max-width:420px;margin:0 auto 18px}
.deck.pulse{box-shadow:0 0 0 3px rgba(227,163,60,.45),0 20px 40px rgba(0,0,0,.45)}

/* видеоинтервью */
.cam{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#0E0F11;border:1px solid var(--line)}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.cam .hud{position:absolute;inset:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.hud-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:#CFCBC3}
.rec{display:flex;align-items:center;gap:7px}
.rec i{width:8px;height:8px;border-radius:50%;background:#5A5A5E}
.cam.playing .rec i{background:var(--rec);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hud-bottom{display:grid;gap:8px}
.caption{justify-self:center;max-width:88%;text-align:center;font-size:15px;line-height:1.35;padding:6px 12px;border-radius:3px;background:rgba(10,10,12,.72);color:#EEE}
.caption:empty{display:none}
.caption .who{font-family:var(--f-cond);font-weight:600;letter-spacing:.08em;font-size:11px;color:var(--amber);display:block;margin-bottom:2px}
.caption.muted{color:#B9B6AF;font-family:var(--f-mono);font-size:12.5px}
.lower{display:flex;width:max-content;max-width:100%}
.lower .bar{width:4px;background:var(--amber)}
.lower .txt{background:rgba(14,15,17,.86);padding:5px 12px 6px}
.lower .nm{color:var(--text);font-size:16px;margin:0}
.lower .rl{font-size:12px;color:#B5B1A8}
.levels{position:absolute;right:14px;bottom:14px;display:flex;gap:3px;align-items:end;height:30px}
.levels i{width:4px;background:var(--amber);height:3px;border-radius:1px;transition:height .09s}
#head{transition:transform .9s cubic-bezier(.4,0,.2,1);transform-origin:320px 190px}
.cam.look #head{transform:translateX(-10px) rotate(-7deg)}

@media (max-width:980px){
  .letter-scene{grid-template-columns:1fr}
  .context{grid-template-columns:1fr}
  .sortrow{grid-template-columns:1fr}
  .tools-hint{display:none}
}
@media (prefers-reduced-motion:reduce){.card.appear,.phone .wave i{animation:none!important}}

/* длинные названия неизвестных («Шестнадцатый») не вылезают за карточку */
.mystery{width:170px}
.mystery .big{font-size:26px;overflow-wrap:anywhere}

/* предмет, к которому только что вернулись */
.thing.just .obj{animation:justDone 1.6s ease-out 1}
.thing.just .pill{box-shadow:0 0 0 2px rgba(134,181,143,.5)}
@keyframes justDone{0%{filter:drop-shadow(0 0 0 rgba(227,163,60,0))}30%{filter:drop-shadow(0 0 18px rgba(227,163,60,.8))}100%{filter:drop-shadow(0 0 0 rgba(227,163,60,0))}}

/* ===== рабочее место: шапка, контрольные точки, выпуск ===== */
.topright{display:flex;gap:6px;align-items:center}
.topbtn.ghostbtn{background:none}
.topbtn:disabled{opacity:.4;cursor:not-allowed}
.topbtn.now{border-color:var(--amber);color:var(--amber)}
.tab{font-size:14px;padding:7px 14px;letter-spacing:.1em}
.checkpoint{display:grid;grid-template-columns:auto;gap:4px 12px;justify-items:end;text-align:right;max-width:520px}
.checkpoint #cpText{font-size:14px;color:var(--text)}
.board-hint{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--amber-soft);border:1px solid rgba(227,163,60,.5);border-radius:5px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.sticky-preview{position:relative;min-height:240px}
.sticky-preview .sticky{position:relative;right:auto;bottom:auto;margin:10px auto 0;display:block}
.thing.studied{opacity:.72}
.thing.studied:hover{opacity:1}
.pill.new{background:rgba(227,163,60,.22);color:#F3C77A;box-shadow:0 0 0 1px rgba(227,163,60,.5)}
.vyp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.vyp-main{display:grid;gap:16px}
.vyp-sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:grid;gap:12px}
.locked-sec{opacity:.55;border-style:dashed}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.claims ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.claim{display:grid;gap:4px;padding:10px 12px;border-radius:4px;background:var(--ground);border-left:3px solid var(--ok);font-family:var(--f-serif);font-size:15.5px}
.claims > div:last-child .claim{border-left-color:var(--muted)}
.claim.disputed{border-left-color:var(--rec)}
.lawyer-note{font-family:var(--f-body);font-size:13px;color:#EDA894}
.ok-l{color:var(--ok)}.no-l{color:var(--muted)}
.empty-li{color:var(--dim);font-size:13px}
.strips{display:grid;gap:10px}
.strip{margin:0;background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:2px;box-shadow:0 6px 14px rgba(0,0,0,.3);transform:rotate(-.3deg)}
.strip:nth-child(even){transform:rotate(.4deg)}
.strip blockquote{margin:0 0 6px;font-family:var(--f-serif);font-size:17px;line-height:1.4}
.strip figcaption{color:var(--ink-muted)}
.drafts{display:grid;gap:8px;margin-top:4px}
.trs{display:grid;gap:10px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--ground);border-radius:4px}
.tr-text{font-family:var(--f-serif);font-size:16px;margin-bottom:4px}
.small-key{padding:7px 10px;font-size:12px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line2);margin-left:6px}
.tl li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0 8px 16px;position:relative;font-size:15px}
.tl li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.tl-date{font-family:var(--f-mono);font-size:12.5px;color:var(--amber);padding-top:2px}
.qs{margin:0;padding-left:18px;display:grid;gap:6px;font-family:var(--f-serif)}
textarea.notes{width:100%;min-height:90px;resize:vertical;background:var(--ground);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:10px;font:inherit;font-size:14px}
@media (max-width:980px){ .vyp{grid-template-columns:1fr} .claims{grid-template-columns:1fr} .checkpoint{justify-items:start;text-align:left} .tl li{grid-template-columns:1fr} }

.pill.crec{background:#2F3B34;color:#A9D1B4}
.claim.cautious{border-left-color:#8FA9C4}
.soft-note{font-family:var(--f-body);font-size:13px;color:#A9C1DA}

/* ===== эпизод 3: ряды, правки редактора, маркер, папка, сообщения ===== */
.rows{display:grid;gap:8px}
.rowpick{display:grid;grid-template-columns:34px minmax(0,1fr) 24px;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:5px;background:var(--ground);color:var(--text)}
.rowpick[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.rowpick.hl{box-shadow:0 0 0 2px var(--amber)}
.rowpick .rl{font-family:var(--f-cond);font-weight:700;font-size:18px;color:var(--amber)}
.rowpick .rw{font-family:var(--f-serif);font-size:18px}
.rowpick .rw .gap-slot{color:var(--amber);border-bottom-color:var(--line2)}
.rowpick .rc{font-family:var(--f-mono);color:var(--amber)}
.rowpick.done{cursor:default}.rowpick.done.yes{border-color:rgba(134,181,143,.6)}
.rowpick.done b{color:var(--ok)}
.editpaper ol{margin:14px 0 0;padding-left:22px;display:grid;gap:14px;font-family:var(--f-serif);font-size:17px;line-height:1.6}
.editpaper li.hl{background:rgba(227,163,60,.28);box-shadow:0 0 0 4px rgba(227,163,60,.28)}
.redpen{color:#C0281C;font-weight:700;font-family:var(--f-hand);font-size:26px;line-height:0;padding:0 2px;position:relative;display:inline-block;min-width:.5em;margin:0 2px;text-align:center}
.redpen.strike::after{content:"";position:absolute;left:-5px;right:-5px;top:0;height:2.5px;background:#C0281C;border-radius:2px;transform:rotate(-24deg)}
.redpen.tick{font-size:20px;margin-left:6px}
.margin-red{font-family:var(--f-hand);color:#C0281C;font-size:22px;margin-top:14px;transform:rotate(-2deg)}
.scene.single{grid-template-columns:minmax(0,1fr)}
.marker-paper .doctext{background:#1A1A1E;color:#E8E1D2;padding:16px 18px;border-radius:3px;line-height:2.1;box-shadow:inset 0 0 22px rgba(0,0,0,.55)}
.marker-paper .doctext .wd{background:rgba(255,255,255,.06);border-radius:3px}
.marker-paper .doctext input.lt{background:rgba(255,255,255,.92);color:#8A2A1E;line-height:1.2;height:1.35em;vertical-align:-.2em}
.marker-paper .doctext b{color:#9EE0A8!important}
.compare{margin-top:10px;border:1px solid #DDD8CD;border-radius:6px;background:#fff;padding:12px 14px;overflow-x:auto}
.compare h3{color:#1F2023;margin-bottom:8px}
.compare table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:460px}
.compare th,.compare td{border-bottom:1px solid #EEE9DF;padding:8px;text-align:left;vertical-align:top;color:#1F2023}
.compare thead th{font-family:var(--f-mono);font-size:12px;color:#6A675F}
.folder{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start;background:linear-gradient(180deg,#8E7148,#7A6040);padding:26px;border-radius:6px}
.folder-item{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.folder-after{grid-column:1/-1}
.clip{background:#EFE9DA;color:var(--ink);padding:16px 18px;box-shadow:0 8px 18px rgba(0,0,0,.35);font-family:var(--f-serif)}
.clip-head{display:flex;justify-content:space-between;border-bottom:2px solid #2A2520;padding-bottom:6px;margin-bottom:10px;font-family:var(--f-cond);letter-spacing:.06em}
.clip h4{font-family:var(--f-serif);font-size:20px;margin:0 0 8px;line-height:1.25}
.clip p{font-size:15px;line-height:1.55;margin:0 0 8px}
.letter-copy{position:relative}
.lc-paper{background:#F6F4EE;color:#1A1A1A;padding:28px 30px;box-shadow:0 10px 22px rgba(0,0,0,.4);font-family:var(--f-mono);font-size:15px;line-height:1.8}
.lc-paper p{margin:0}
.lc-sign{margin-top:14px!important;text-align:right}
.lc-margin{font-family:var(--f-hand);color:#2A3A6A;font-size:21px;margin-top:10px;transform:rotate(-1.5deg)}
.end-doc{max-width:460px;margin:16px auto 0;text-align:left}
.notice{position:fixed;right:18px;bottom:18px;z-index:60;width:min(360px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--amber);border-radius:8px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:appear .5s ease-out both}
.notice .n-top{display:flex;justify-content:space-between;gap:8px}
.notice p{font-family:var(--f-serif);font-size:16px}
.o-editcopy{width:140px;height:170px;position:relative}
.o-editcopy i{position:absolute;inset:0;background:var(--paper);box-shadow:0 8px 14px rgba(0,0,0,.35);transform:rotate(3deg)}
.o-editcopy i::before{content:"";position:absolute;inset:18px 14px 60px;background:repeating-linear-gradient(180deg,#B9B09C 0 2px,transparent 2px 10px)}
.o-editcopy i::after{content:"";position:absolute;left:14px;right:14px;bottom:26px;height:26px;background:#1C1C20;transform:rotate(-2deg)}
.o-editcopy b{position:absolute;right:10px;top:10px;font-family:var(--f-hand);color:#C0281C;font-size:22px;transform:rotate(8deg)}
.o-folder{width:180px;height:130px;position:relative;background:linear-gradient(180deg,#C9A96E,#A8864F);border-radius:3px 10px 4px 4px;box-shadow:0 10px 18px rgba(0,0,0,.45);transform:rotate(-2deg)}
.o-folder::before{content:"";position:absolute;left:0;top:-12px;width:70px;height:16px;background:#C9A96E;border-radius:4px 8px 0 0}
.o-folder span{position:absolute;left:18px;top:40px;font-family:var(--f-hand);font-size:24px;color:#2A2118}
/* эпизоды 4–5: строки с предложением, сочинения, голосовое, протокол, сборка выпуска */
.msent{grid-column:1/-1;font-family:var(--f-serif);font-size:16.5px;line-height:1.5;color:var(--text)}
.msent .who,.decide-row .who{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.msent .mk{display:inline-block;min-width:10px;color:var(--amber);font-weight:700}
.pencil{font-family:var(--f-hand);color:#5E5A55;font-size:22px;margin:0 2px;vertical-align:-2px}
.essay-lines{margin:6px 0 0;padding-left:22px;display:grid;gap:14px;font-family:var(--f-hand);font-size:24px;line-height:1.3;color:#24324A}
.essay-lines li.hl{background:rgba(227,163,60,.28);box-shadow:0 0 0 4px rgba(227,163,60,.28)}
.paper.essay{background:repeating-linear-gradient(180deg,var(--paper) 0 31px,rgba(90,120,160,.25) 31px 32px);background-color:var(--paper)}
.o-essays{width:150px;height:175px;position:relative}
.o-essays i{position:absolute;inset:0;background:#DCE3EA;box-shadow:0 8px 14px rgba(0,0,0,.35);border-left:8px solid #6C8CA8}
.o-essays i:first-child{transform:rotate(-5deg);background:#E6DECB}
.o-essays i:nth-child(2){transform:rotate(3deg)}
.o-essays b{position:absolute;left:24px;top:30px;font-family:var(--f-hand);font-size:26px;color:#24324A;transform:rotate(3deg)}
.o-voice{width:120px;height:170px;border-radius:18px;background:#0C0D0F;border:5px solid #2A2C31;position:relative;box-shadow:0 10px 18px rgba(0,0,0,.5)}
.o-voice i{position:absolute;left:14px;right:14px;top:62px;height:26px;border-radius:13px;background:#2E6B45}
.o-voice span{position:absolute;left:0;right:0;top:98px;text-align:center;font-family:var(--f-mono);font-size:12px;color:#9FB3A6}
.cam.voicemsg{background:radial-gradient(circle at 50% 40%,#1E2A35,#0D1014)}
.cam.voicemsg .vm{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--text)}
.cam.voicemsg .vm b{font-family:var(--f-cond);font-size:24px;letter-spacing:.03em}
.vm-wave{display:flex;gap:3px;height:34px;align-items:center}
.vm-wave i{width:4px;height:6px;border-radius:2px;background:var(--ok)}
.cam.voicemsg.playing .vm-wave i{animation:wave 1.1s ease-in-out infinite}
.cam.voicemsg.playing .vm-wave i:nth-child(odd){animation-delay:.3s}
.protocol{background:#F4F1E8;color:#1D1D1D;padding:22px 26px;box-shadow:0 10px 22px rgba(0,0,0,.35);font-family:var(--f-serif);font-size:16px;line-height:1.6}
.protocol .p-head{font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;font-size:18px}
.protocol .p-sub{text-align:center;font-size:14px;color:#555;margin-bottom:14px}
.protocol .p-sign{margin-top:18px;text-align:right;font-style:italic}
.build{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.build-main{display:grid;gap:16px}
.bclaim{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.bclaim .seg{flex-wrap:wrap}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.reason{display:grid;gap:6px;justify-items:start;padding:10px 12px;border-left:3px solid var(--rec);background:var(--ground);border-radius:4px}
.reason.soft{border-left-color:#8FA9C4}
.reason p{font-family:var(--f-serif);font-size:15.5px}
.aired{margin:0;padding-left:22px;display:grid;gap:8px;font-family:var(--f-serif);font-size:17px}
.after-air p{font-family:var(--f-serif);font-size:17px}
.vm-final{display:grid;gap:10px;justify-items:start;padding:14px;background:var(--ground);border-radius:6px;border:1px solid var(--line)}
.vm-lines p{font-family:var(--f-serif);font-size:18px;font-style:italic}
@media (max-width:860px){ .build{grid-template-columns:1fr} }
.intro-lead{font-family:var(--f-serif);font-style:italic;font-size:17px;line-height:1.5;color:var(--muted);max-width:52ch;margin:0 0 14px;padding-left:12px;border-left:2px solid var(--line2)}
/* узкий экран: шапка в две строки — логотип и кнопки сверху, вкладки снизу */
@media (max-width:720px){
  .top{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .logo{font-size:16px;flex:1;min-width:0}
  .logo small{overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  .topright{order:2}
  .tabs{order:3;flex:1 1 100%}
  .topbtn{padding:6px 9px;font-size:12px}
  .desk{padding:16px}
  .things{gap:22px 10px}
  .thing .obj{transform:scale(.8)}
}
/* выбранный вариант в заданиях на светлой бумаге виден сразу */
.qopt.lite{background:rgba(255,255,255,.55);color:var(--ink);border-color:#9C8F78}
.qopt.lite:hover{border-color:#6C6152}
.qopt.lite[aria-pressed="true"]{background:#2E4056;color:#F1ECE1;border-color:#2E4056}
.notegrid{display:grid;gap:8px}
</style>
</head>

<script id="v16-engine">
/* =====================================================================
   ВЫПУСК-16 · ДВИЖОК · ЯДРО
   Утилиты, проверка текста, состояние, звук. Ничего не знает о сюжете.
   ===================================================================== */
(function(){
"use strict";
const E = V16.engine = {};

/* ---------- утилиты ---------- */
E.esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// латинские двойники кириллических букв (частая опечатка при смене раскладки) считаем кириллицей
const LAT={a:'а',e:'е',o:'о',p:'р',c:'с',x:'х',y:'у',k:'к',m:'м',t:'т',h:'н',b:'в'};
E.norm = w => String(w).toLowerCase().replace(/[aeopcxykmthb]/g,ch=>LAT[ch]).replace(/ё/g,'е').trim();
E.sleep = ms => new Promise(r=>setTimeout(r,ms));
E.pairKey = (a,b) => [a,b].sort().join('|');
E.fillTokens = (text, fn) => text.split(/\[\[(\w+)\]\]/).map((part,i)=> i%2 ? fn(part) : E.esc(part)).join('');

function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
E.tokenize = function(str){
  const s=String(str).replace(/[«»"„“]/g,' ').replace(/\s+/g,' ').trim();
  const re=/[A-Za-zА-Яа-яЁё]+(?:-[A-Za-zА-Яа-яЁё]+)*/g; const words=[],gaps=[]; let m,last=0;
  while((m=re.exec(s))){ gaps.push(s.slice(last,m.index)); words.push({raw:m[0],n:E.norm(m[0])}); last=m.index+m[0].length; }
  gaps.push(s.slice(last)); return {words,gaps};
};
function near(u,t){ if(u===t) return true; const L=t.length, thr=L>=7?2:(L>=4?1:0); return lev(u,t)<=thr; }
function align(U,T){
  const n=U.length,m=T.length,INF=1e9; const d=Array.from({length:n+1},()=>Array(m+1).fill(INF)); d[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){ if(!i&&!j)continue; let b=INF;
    if(i>0) b=Math.min(b,d[i-1][j]+1); if(j>0) b=Math.min(b,d[i][j-1]+1);
    if(i>0&&j>0){ const u=U[i-1].n,t=T[j-1].n; if(u===t) b=Math.min(b,d[i-1][j-1]); else if(near(u,t)) b=Math.min(b,d[i-1][j-1]+.5); }
    d[i][j]=b; }
  const ops=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0){ const u=U[i-1].n,t=T[j-1].n;
      if(u===t&&d[i][j]===d[i-1][j-1]){ ops.push({k:'match',u:i-1,t:j-1}); i--; j--; continue; }
      if(u!==t&&near(u,t)&&d[i][j]===d[i-1][j-1]+.5){ ops.push({k:'near',u:i-1,t:j-1}); i--; j--; continue; } }
    if(i>0&&d[i][j]===d[i-1][j]+1){ ops.push({k:'ins',u:i-1}); i--; continue; }
    ops.push({k:'del',t:j-1}); j--;
  }
  return ops.reverse();
}

/* Проверка транскрибации.
   Возвращает issues в едином формате движка:
   {key, kind:'n9'|'n16'|'listen', sub, skill, ref, word, answer, correct, explain, h3, focus} */
E.checkTranscript = function(task, input){
  const T=E.tokenize(task.text), U=E.tokenize(input);
  if(!U.words.length) return {empty:true};
  const ops=align(U.words,T.words); const t2u=Array(T.words.length).fill(-1);
  const issues=[], typos=[], missBefore={}; let pending=[];
  const key9=task.key9||{}, gaps=task.gaps||{};
  ops.forEach(op=>{
    if(op.k==='match'||op.k==='near'){ t2u[op.t]=op.u; if(pending.length){ missBefore[op.u]=pending.slice(); pending=[]; } }
    if(op.k==='near'){
      const tw=T.words[op.t].n, uw=U.words[op.u].n, k=key9[tw];
      if(k){ let rootOnly=uw.length===tw.length; if(rootOnly) for(let x=0;x<tw.length;x++){ if(uw[x]!==tw[x]&&!k.pos.includes(x)){rootOnly=false;break;} }
        if(rootOnly) issues.push({kind:'n9',key:'9:'+tw,skill:k.skill,u:op.u,word:tw,answer:input.trim(),correct:task.text,explain:k.explain,h3:k.h3,focus:`Корень слова «${T.words[op.t].raw}»`});
        else issues.push({kind:'listen',sub:'spell',key:'spell:'+tw,u:op.u});
      } else typos.push({was:U.words[op.u].raw,is:T.words[op.t].raw});
    }
    if(op.k==='ins') issues.push({kind:'listen',sub:'extra',key:'extra:'+U.words[op.u].n,u:op.u});
    if(op.k==='del'){ pending.push(op.t); issues.push({kind:'listen',sub:'miss',key:'miss:'+op.t,t:op.t}); }
  });
  const trailing=pending.slice();
  // Значимые знаки между словами: запятая, конец предложения (. ? !). Тире, кавычки, двоеточие не проверяем.
  const markOf = g => { const m=String(g).match(/[.?!…]+/); if(m){ const c=m[0]; return c.includes('?')?'?':c.includes('!')?'!':'.'; } return /,/.test(g)?',':''; };
  const markName = m => ({'.':'точка', '?':'вопросительный знак', '!':'восклицательный знак', ',':'запятая', '':'без знака'})[m];
  const recIssue = (key, u, need, has, focus) => issues.push({kind:'rec',key,skill:'rec-granica',u,need,answer:input.trim(),correct:task.text,
    explain:`Здесь ${need?'нужен знак: '+markName(need):'предложение не заканчивается'}, а в записи — ${markName(has)}. Каждое предложение заканчивается точкой, вопросительным или восклицательным знаком.`, focus});
  for(let i=0;i<T.words.length-1;i++){
    if((task.free||[]).includes(i)) continue;
    const a=t2u[i], b=t2u[i+1]; if(a<0||b<0||b!==a+1) continue;
    const tm=markOf(T.gaps[i+1]), um=markOf(U.gaps[a+1]);
    if(tm===um) continue;
    const tEnd='.?!'.includes(tm)&&tm!=='', uEnd='.?!'.includes(um)&&um!=='';
    if(!tEnd && !uEnd){                                   // запятая против отсутствия знака — №16
      const need=tm===',', g=gaps[i]; const beforeI=T.words[i+1].n==='и';
      const skill=g?g.skill:(need?'16-granica':(beforeI?'16-lishnyaya':'16-znak'));
      issues.push({kind:'n16',key:'16:'+i,skill,u:a,need,answer:input.trim(),correct:task.text,
        explain:g?g.explain:'Между этими словами нет ни границы частей сложного предложения, ни однородных членов — знак не нужен.',
        h3:g&&g.h3, focus:need?'Пропущен знак между частями':'Лишний знак'});
    } else recIssue('rec:'+i, a, tm, um, tEnd?'Граница предложений':'Лишний знак конца предложения');
  }
  // знак в конце всей записи
  const tFinal=markOf(T.gaps[T.words.length]), uFinal=markOf(U.gaps[U.words.length]);
  if(tFinal && tFinal!==',' && uFinal && tFinal!==uFinal && t2u[T.words.length-1]===U.words.length-1)   // пропущенный знак в самом конце не считаем ошибкой
    recIssue('rec:end', U.words.length-1, tFinal, uFinal, 'Знак в конце предложения');
  const ord={listen:0,rec:1,n16:1,n9:2};
  issues.sort((x,y)=>(ord[x.kind]-ord[y.kind])||((x.u??x.t??0)-(y.u??y.t??0)));
  return {ok:!issues.length, issues, typos, U, missBefore, trailing};
};
E.echoHTML = function(r,is){
  let h=''; const hl=new Set(), gapAfter=new Set(); const missAt = is.sub==='miss' ? is.t : null;
  if(is.kind==='rec'){ hl.add(is.u); if(is.key!=='rec:end') hl.add(is.u+1); gapAfter.add(is.u); }
  else if(is.u!=null && is.kind!=='n16') hl.add(is.u);
  if(is.kind==='n16'){ hl.add(is.u); hl.add(is.u+1); gapAfter.add(is.u); }
  r.U.words.forEach((w,j)=>{
    if(missAt!=null && r.missBefore[j] && r.missBefore[j].includes(missAt)) h+='<span class="miss">пропуск</span> ';
    h+= hl.has(j)?`<span class="hl">${E.esc(w.raw)}</span>`:E.esc(w.raw);
    if(gapAfter.has(j)) h+='<span class="gap"></span>';
    h+=' ';
  });
  if(missAt!=null && r.trailing.includes(missAt)) h+='<span class="miss">пропуск</span>';
  return h;
};

/* ---------- состояние всей игры ----------
   S.eps[epId] — прогресс внутри эпизода; материалы, архив, нити и позиции карточек — общие. */
E.epFresh = () => ({ introStep:0, opened:{}, visited:{}, played:{}, facts:{ans:{},checked:false},
  version:{distrust:[],question:"",done:false}, diaryEntry:null, tapeFrag:null, browserPage:null, interviewFrag:null });
E.fresh = function(){
  const S={ v:2, cur:V16.GAME.order[0], active:V16.GAME.order[0], view:"intro", param:null, eps:{}, mat:{}, archive:[], links:[], cardPos:{}, seenCards:{},
    fixAns:{}, fixDone:{}, flags:{}, notes:{}, found:{}, fired:{}, inbox:[], ui:{diaryEntry:null, tapeFrag:null, interviewFrag:null, browserPage:null, vypuskFocus:"all"},
    archiveTab:"errors", archiveFilter:"all", board:{zoom:null, focus:"all"},
    final:{ view:"build", claims:{}, decisions:{}, result:null, lawyer:null, attempts:0 } };
  V16.GAME.order.forEach(id=>{ S.eps[id]=E.epFresh(); Object.keys(V16.EPISODES[id].materials).forEach(k=>S.mat[k]={status:"none",answers:{},value:""}); });
  return S;
};
E.load = function(){
  const f=E.fresh();
  try{
    const raw=localStorage.getItem(V16.GAME.storageKey);
    if(raw){ const o=JSON.parse(raw); if(o&&o.v===2&&o.eps){
      V16.GAME.order.forEach(id=>{ o.eps[id]=Object.assign(E.epFresh(),o.eps[id]||{}); });
      Object.keys(f.mat).forEach(k=>{ if(!o.mat[k]) o.mat[k]=f.mat[k]; });
      if(!o.active) o.active=o.cur; o.ui=Object.assign(f.ui,o.ui||{}); o.notes=o.notes||{}; o.found=o.found||{}; o.fired=o.fired||{}; o.inbox=o.inbox||[]; Object.keys(o.mat).forEach(k=>{ if(o.mat[k].status!=="none") o.found[k]=true; });
      (o.links||[]).forEach(l=>{ delete l.support; });
      return Object.assign(f,o); } }
    // перенос прогресса из отдельного файла эпизода 1
    const old=localStorage.getItem(V16.GAME.legacyKeys.e1);
    if(old){ const o=JSON.parse(old); if(o&&o.mat){
      ["introStep","opened","visited","played","facts","version","diaryEntry","tapeFrag","browserPage"].forEach(k=>{ if(o[k]!=null) f.eps.e1[k]=o[k]; });
      Object.keys(o.mat).forEach(k=>{ if(f.mat[k]) f.mat[k]=o.mat[k]; });
      f.archive=(o.archive||[]).map(e=>Object.assign({ep:"e1"},e));
      f.links=(o.links||[]).map(l=>{ const x=Object.assign({ep:"e1"},l); delete x.support; return x; });
      f.seenCards=o.seenCards||{}; Object.keys(f.mat).forEach(k=>{ if(f.mat[k].status!=="none") f.found[k]=true; }); f.fixAns=o.fixAns||{}; f.fixDone=o.fixDone||{};
      f.view = o.view==="intro" ? "intro" : "desk";
      return f; } }
  }catch(e){}
  return f;
};
E.save = function(){ try{ localStorage.setItem(V16.GAME.storageKey, JSON.stringify(E.S)); }catch(e){} };
E.P = () => E.S.eps[E.EP.id];                                   // прогресс текущего эпизода
E.epIndex = id => V16.GAME.order.indexOf(id);
E.epUnlocked = id => { const i=E.epIndex(id); return i===0 || !!E.S.eps[V16.GAME.order[i-1]].version.done; };
E.switchEp = id => { E.EP=V16.EPISODES[id]; E.S.cur=id; E.S.active=id; };
E.epOfMat = m => E.MAT_EP[m];
E.matDef = m => V16.EPISODES[E.MAT_EP[m]].materials[m];
E.isFound = m => !!E.S.mat[m] && (E.S.mat[m].status!=="none" || !!E.S.found[m]);
E.taskOfMat = m => V16.EPISODES[E.MAT_EP[m]].tasks[E.matDef(m).task];
E.MAT_EP = {}; E.findTask = id => { for(const ep of V16.GAME.order){ const t=V16.EPISODES[ep].tasks[id]; if(t) return t; } return null; };

/* ---------- архив ошибок ---------- */
E.logIssue = function(task, is, ctx){
  if(!is.skill) return;                                  // ошибки слушания не пишем
  const key=`${ctx.fix?"fix:":""}${task.id}:${is.key}`;
  if(E.S.archive.some(e=>e.key===key)) return;           // только первая ошибка
  const ep = (!ctx.fix && task.mat && E.MAT_EP[task.mat]) || E.EP.id;
  E.S.archive.push({ key, ep, skill:is.skill, cat:V16.SKILLS[is.skill].cat,
    mat: ctx.fix?null:task.mat, episode: ctx.fix?"Исправить дело":V16.EPISODES[ep].short, source:task.title,
    task: task.prompt||"", focus:is.focus||"", answer:is.answer, correct:is.correct, explain:is.explain||"",
    fixed:false, hints:0, t:Date.now() });
};
E.noteHint = function(task, is, level, ctx){
  const key=`${ctx.fix?"fix:":""}${task.id}:${is.key}`;
  const e=E.S.archive.find(x=>x.key===key); if(e) e.hints=Math.max(e.hints||0,level);
};
E.logLogic = function(item, ans, ctx){
  const skill=item.fact?"logic-under":"logic-over";
  const key=`${ctx.fix?"fix:":""}logic:${item.id}`; if(E.S.archive.some(e=>e.key===key)) return;
  E.S.archive.push({ key, ep:E.EP.id, skill, cat:"log", mat:null, episode:ctx.fix?"Исправить дело":E.EP.short,
    source:"Факт или предположение", task:item.st, focus:V16.SKILLS[skill].name,
    answer: ans?"Доказано материалами":"Предположение", correct:item.fact?"Доказано материалами":"Предположение",
    explain:item.why, fixed:false, hints:0, t:Date.now() });
};
E.hintText = function(is, level){
  const sk=V16.SKILLS[is.skill]||{};
  if(is.kind==="listen") return V16.LISTEN_HINTS[is.sub][level-1];
  if(level===1) return is.h1 || sk.h1 || `Проверь гласную в корне слова «${is.word}».`;
