/* ---------- звук: голоса и плёнка ---------- */
const tts='speechSynthesis' in window; let voices={f:null,m:null,any:null};
function pickVoices(){ if(!tts) return; const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));
  voices.any=vs[0]||null;
  voices.m=vs.find(v=>/dmitr|pavel|maxim|yuri|artem|nikolai|male|мужск/i.test(v.name))||null;
  voices.f=vs.find(v=>/irina|svetlana|dariya|daria|milena|ekaterina|elena|anna|female|жен|google/i.test(v.name))||null; }
if(tts){ pickVoices(); speechSynthesis.onvoiceschanged=pickVoices; }
E.hasVoice = () => tts && !!voices.any;
E.playToken = 0;
E.stopAudio = function(){ E.playToken++; if(tts) speechSynthesis.cancel(); tape.hiss(false); };
E.say = function(text, voice, rate, pitch){ return new Promise(res=>{
  if(!E.hasVoice()){ setTimeout(res, Math.min(4000, text.length*55)); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='ru-RU';
  const v = voice==='m' ? (voices.m||voices.any) : voice==='f' ? (voices.f||voices.any) : voices.any;
  u.voice=v; u.rate=rate||1; u.pitch=pitch||1;
  // если нужного пола голоса нет — имитируем высотой
  if(voice==='m' && !voices.m) u.pitch=Math.max(.1,(pitch||1)*.7);
  u.onend=res; u.onerror=res; speechSynthesis.speak(u);
});};
const tape = E.tape = {
  ctx:null, g:null,
  ensure(){ if(this.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); const sr=this.ctx.sampleRate, len=sr*2; const buf=this.ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*.55; if(Math.random()<.0005) d[i]=(Math.random()*2-1)*3; }
      const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.55;
      const g=this.ctx.createGain(); g.gain.value=0; src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(); this.g=g;
    }catch(e){ this.ctx=null; } },
  hiss(on){ if(on) this.ensure(); if(!this.g) return; if(this.ctx.state==='suspended') this.ctx.resume();
    const t=this.ctx.currentTime; this.g.gain.cancelScheduledValues(t); this.g.gain.setTargetAtTime(on?.045:0,t,.08); },
  drop(ms){ if(!this.g) return; const t=this.ctx.currentTime; this.g.gain.cancelScheduledValues(t);
    this.g.gain.setValueAtTime(.14,t); this.g.gain.setTargetAtTime(.002,t+.04,.04); this.g.gain.setTargetAtTime(.045,t+ms/1000,.08); },
  click(){ this.ensure(); if(!this.g) return; const t=this.ctx.currentTime; this.g.gain.cancelScheduledValues(t);
    this.g.gain.setValueAtTime(.35,t); this.g.gain.setTargetAtTime(.045,t+.03,.03); }
};
E.playCues = async function(cues, opt){
  E.stopAudio(); const tok=E.playToken; const rate=opt.rate||1;
  if(!opt.noHiss){ tape.click(); tape.hiss(true); }
  for(const c of cues){
    if(tok!==E.playToken) return false;
    if(c.t==='host'){ opt.caption(c.text, 'Ведущий'); await E.sleep(c.ms||2400); continue; }
    if(c.t==='look'){ opt.look&&opt.look(c.on); continue; }
    if(c.cap!==undefined || c.key) opt.caption(c.key ? '[ реплика не расшифрована ]' : c.cap, c.who);
    if(c.t==='click'){ tape.click(); await E.sleep(160); }
    else if(c.t==='wait'){ await E.sleep(c.ms); }
    else if(c.t==='noise'){ opt.level(false); await E.sleep(c.ms/Math.min(1,rate)); }
    else if(c.t==='drop'){ tape.drop(c.ms); opt.level(false); await E.sleep(c.ms); }
    else if(c.t==='say'){ opt.level(true); await E.say(c.text, c.voice, rate*(c.rate||1), c.pitch||1); opt.level(false); if(tok!==E.playToken) return false; if(c.pause) await E.sleep(c.pause); }
  }
  if(tok!==E.playToken) return false;
  tape.hiss(false); return true;
};
})();
/* =====================================================================
   ВЫПУСК-16 · ДВИЖОК · ЗАДАНИЯ
   Один «прогон задания» (runTask) + типы механик.
   Тип задания описывает: render, ready, check, value, done.
   Ступенчатые подсказки, черновики, архив — общие для всех типов.
   ===================================================================== */
(function(){
"use strict";
const E=V16.engine, esc=E.esc, T=E.TYPES={};

/* ---------- letters: вставь букву ---------- */
T.letters = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="${task.hand?'hand':'doctext'}">${E.fillTokens(task.text, id=>{ const b=task.blanks[id];
      return `<span class="wd ${o.hl===id?'hl':''}">${esc(b.pre)}<input class="lt" data-b="${id}" value="${esc(ans[id]||'')}" aria-label="Пропущенная буква: ${esc(b.pre)}…${esc(b.post)}" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(b.post)}</span>`; })}</div>`;
    const all=[...el.querySelectorAll('input.lt')];
    const commit=(i,ch)=>{ i.value=ch; ans[i.dataset.b]=ch; o.onChange(); if(ch){ const nx=all[all.indexOf(i)+1]; if(nx) nx.focus(); } };
    all.forEach(i=>{
      i.onfocus=()=>i.select();                                   // новая буква заменяет старую
      i.onkeydown=e=>{ if(e.key && e.key.length===1 && /\p{L}/u.test(e.key) && !e.ctrlKey && !e.metaKey){ e.preventDefault(); commit(i,e.key); } };
      i.oninput=()=>commit(i, i.value.trim().slice(-1));          // мобильные клавиатуры и вставка
    });
  },
  ready:(task,ans)=>Object.keys(task.blanks).every(id=>ans[id]),
  missing:(task,ans)=>{ const n=Object.keys(task.blanks).filter(id=>!ans[id]); return {text:`Осталось вставить букв: ${n.length}.`, ref:n[0]}; },
  check(task, ans){
    const issues=[];
    Object.entries(task.blanks).forEach(([id,b])=>{ const v=E.norm(ans[id]||'');
      if(v!==b.a) issues.push({kind:'n9',key:id,ref:id,skill:b.skill,word:b.pre+'…'+b.post,
        answer:b.pre+(v||'_')+b.post, correct:b.pre+b.a+b.post, explain:b.explain, h1:b.h1, h3:b.h3, focus:`Корень в слове «${b.pre}…${b.post}»`}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.text.replace(/\[\[(\w+)\]\]/g,(m,id)=>{ const b=task.blanks[id]; return b.pre+(ans[id]||'_')+b.post; }),
  done:(task)=>`<div class="${task.hand?'hand':'doctext'}">${E.fillTokens(task.text,id=>{ const b=task.blanks[id]; return `<span class="wd">${esc(b.pre)}<b style="color:#3F7A4C">${esc(b.a)}</b>${esc(b.post)}</span>`; })}</div>`
};

/* ---------- choice: выбери вариант (+ вопрос о правиле) ---------- */
T.choice = {
  render(task, el, ans, o){
    const text=E.fillTokens(task.text, id=>{ const b=task.blanks[id];
      return `<span class="wd ${o.hl===id?'hl':''}">${esc(b.pre)}<span class="gap-slot">${esc(ans[id]||'_')}</span>${esc(b.post)}<span class="pick">${b.opts.map(l=>`<button type="button" data-b="${id}" data-l="${l}" aria-pressed="${ans[id]===l}">${l}</button>`).join('')}</span></span>`; });
    const rules=Object.entries(task.rules||{}).map(([rid,r])=>`<div class="card-box" style="margin-top:14px;background:rgba(0,0,0,.05);border-color:#BDB29A;color:var(--ink)">
      <div class="label" style="color:var(--ink-muted)">${esc(r.q)}</div>
      <div class="qopts">${r.options.map((op,i)=>`<button type="button" class="qopt lite ${o.hl===rid?'hl':''}" data-r="${rid}" data-i="${i}" aria-pressed="${ans[rid]===i}">${esc(op)}</button>`).join('')}</div></div>`).join('');
    el.innerHTML=`<div class="${task.hand?'hand':'doctext'}">${text}</div>${rules}`;
    el.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{ ans[b.dataset.b]=b.dataset.l; T.choice.render(task,el,ans,o); o.onChange(); });
    el.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ ans[b.dataset.r]=+b.dataset.i; T.choice.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>Object.keys(task.blanks).every(id=>ans[id]) && Object.keys(task.rules||{}).every(id=>ans[id]!=null),
  missing:(task,ans)=>{ const b=Object.keys(task.blanks).find(id=>!ans[id]); if(b) return {text:'Выбери букву в каждом размытом слове.', ref:b};
    return {text:'Ответь ещё на вопрос о правиле — он под текстом записи.', ref:Object.keys(task.rules||{}).find(id=>ans[id]==null)}; },
  check(task, ans){
    const issues=[];
    Object.entries(task.blanks).forEach(([id,b])=>{ if(ans[id]!==b.a) issues.push({kind:'n9',key:id,ref:id,skill:b.skill,word:b.pre+'…'+b.post,
      answer:b.pre+(ans[id]||'_')+b.post, correct:b.pre+b.a+b.post, explain:b.explain, h3:b.h3, focus:`Корень в слове «${b.pre}…${b.post}»`}); });
    Object.entries(task.rules||{}).forEach(([rid,r])=>{ if(ans[rid]!==r.correct) issues.push({kind:'n9',key:rid,ref:rid,skill:r.skill,
      answer:r.options[ans[rid]]||'—', correct:r.options[r.correct], explain:r.explain, h1:r.h1, h3:r.h3, focus:r.q}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.text.replace(/\[\[(\w+)\]\]/g,(m,id)=>{ const b=task.blanks[id]; return b.pre+(ans[id]||'_')+b.post; }),
  done:(task)=>`<div class="${task.hand?'hand':'doctext'}">${E.fillTokens(task.text,id=>{ const b=task.blanks[id]; return `<span class="wd">${esc(b.pre)}<b style="color:#3F7A4C">${esc(b.a)}</b>${esc(b.post)}</span>`; })}</div>`
};

/* ---------- probe: подбери проверочное слово ---------- */
T.probe = {
  render(task, el, ans, o){
    const text=E.fillTokens(task.text, id=>{ const b=task.blanks[id]; const ch=ans[id]!=null?b.opts[ans[id]].l:'_';
      return `<span class="wd ${o.hl===id?'hl':''}">${esc(b.pre)}<span class="gap-slot">${esc(ch)}</span>${esc(b.post)}</span>`; });
    const list=Object.entries(task.blanks).map(([id,b])=>`<div class="probe">
      <div class="w" style="color:var(--ink)">${esc(b.pre)}<span class="gap-slot">${ans[id]!=null?esc(b.opts[ans[id]].l):'_'}</span>${esc(b.post)} <span class="label" style="color:var(--ink-muted)">проверочное слово:</span></div>
      <div class="row">${b.opts.map((op,i)=>`<button type="button" class="qopt lite" data-b="${id}" data-i="${i}" aria-pressed="${ans[id]===i}">${esc(op.w)}</button>`).join('')}</div></div>`).join('');
    el.innerHTML=`<div class="${task.hand?'hand':'doctext'}">${text}</div><div style="margin-top:14px">${list}</div>`;
    el.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ ans[b.dataset.b]=+b.dataset.i; T.probe.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>Object.keys(task.blanks).every(id=>ans[id]!=null),
  missing:(task,ans)=>({text:'Подбери проверочное слово для каждого размытого слова.', ref:Object.keys(task.blanks).find(id=>ans[id]==null)}),
  check(task, ans){
    const issues=[];
    Object.entries(task.blanks).forEach(([id,b])=>{ if(ans[id]!==b.correct){ const op=b.opts[ans[id]]||{w:'—',l:'_'}, co=b.opts[b.correct];
      issues.push({kind:'n9',key:id,ref:id,skill:b.skill,word:b.pre+'…'+b.post,
        answer:`«${op.w}» → ${b.pre}${op.l}${b.post}`, correct:`«${co.w}» → ${b.pre}${b.a}${b.post}`, explain:b.explain, h1:b.h1, h3:b.h3, focus:`Проверочное слово к «${b.pre}…${b.post}»`}); } });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.text.replace(/\[\[(\w+)\]\]/g,(m,id)=>{ const b=task.blanks[id]; return b.pre+(ans[id]!=null?b.opts[ans[id]].l:'_')+b.post; }),
  done:(task)=>T.letters.done(task)
};

/* ---------- marks: пометки в документе — знак на месте или ошибка ---------- */
T.marks = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="decide">${task.items.map(it=>`<div class="decide-row ${o.hl===it.id?'hl':''}">
      <span class="n">${esc(task.itemLabel||'пометка')} ${it.n}</span>${task.inline?`<div class="msent">${it.who?`<span class="who">${esc(it.who)}</span>`:''}${esc(it.before)}<span class="mk">${it.printed||'&nbsp;'}</span>${it.pencil?`<span class="pencil">${esc(it.pencil)}</span>`:''} ${esc(it.after)}</div>`:''}
      <div class="seg" role="group" aria-label="Пометка ${it.n}"><button type="button" data-s="${it.id}" data-v="ok" aria-pressed="${ans[it.id]==='ok'}">${esc((task.labels||[])[0]||'Знак на месте')}</button><button type="button" data-s="${it.id}" data-v="err" aria-pressed="${ans[it.id]==='err'}">${esc((task.labels||[])[1]||'Здесь ошибка')}</button></div>
    </div>`).join('')}</div>`;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ ans[b.dataset.s]=b.dataset.v; T.marks.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>task.items.every(it=>ans[it.id]),
  missing:(task,ans)=>({text:'Реши про каждую пометку: знак на месте или здесь ошибка.', ref:(task.items.find(it=>!ans[it.id])||{}).id}),
  check(task, ans){
    const issues=[];
    task.items.forEach(it=>{ const right=((it.printed===',')===it.need)?'ok':'err';
      if(ans[it.id]!==right) issues.push({kind:'n16',key:it.id,ref:it.id,skill:it.skill,
        answer:`Пометка ${it.n}: «${ans[it.id]==='ok'?((task.labels||[])[0]||'знак на месте'):((task.labels||[])[1]||'здесь ошибка')}»`,
        correct:`Пометка ${it.n}: «${right==='ok'?((task.labels||[])[0]||'знак на месте'):((task.labels||[])[1]||'здесь ошибка')}». Правильно: ${it.fixed}`, explain:it.explain, h3:it.h3, focus:`${task.focusLabel||'Пункт'} ${it.n}`}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.items.map(it=>`${it.n}: ${ans[it.id]||'—'}`).join('; '),
  done:(task)=>`<div class="decide">${task.items.map(it=>`<div class="decide-row"><span class="n">${esc(task.itemLabel||'пометка')} ${it.n}</span><span style="font-family:var(--f-serif)">${it.who?`<span class="who">${esc(it.who)}</span> `:''}${esc(it.fixed)}</span></div>`).join('')}</div>`
};

/* ---------- rows: ряды слов в формате ЕГЭ №9 — выбрать ряды, где пропущена одна и та же буква ----------
   task.rows:[{id, label, words:[{pre,post,a}], skill, explain, h3}] — «same» вычисляется по буквам.
   Ошибка пишется в архив по орфограмме ряда (skill), а не как «ошибка в №9». */
const rowSame = r => r.words.every(w=>E.norm(w.a)===E.norm(r.words[0].a));
T.rows = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="rows">${task.rows.map(r=>`<button type="button" class="rowpick ${o.hl===r.id?'hl':''}" data-r="${r.id}" aria-pressed="${!!ans[r.id]}">
      <span class="rl">${esc(r.label)}</span><span class="rw">${r.words.map(w=>`${esc(w.pre)}<span class="gap-slot">_</span>${esc(w.post)}`).join(', ')}</span>
      <span class="rc" aria-hidden="true">${ans[r.id]?'✓':''}</span></button>`).join('')}</div>`;
    el.querySelectorAll('.rowpick').forEach(b=>b.onclick=()=>{ ans[b.dataset.r]=!ans[b.dataset.r]; T.rows.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>task.rows.some(r=>ans[r.id]),
  missing:()=>({text:'Выбери хотя бы одну группу, в которой, по-твоему, во всех словах пропущена одна и та же буква.'}),
  check(task, ans){
    const issues=[]; const filled=r=>r.words.map(w=>w.pre+w.a+w.post).join(', ');
    task.rows.forEach(r=>{ const same=rowSame(r), chosen=!!ans[r.id];
      if(chosen!==same) issues.push({kind:'n9', key:r.id, ref:r.id, skill:r.skill,
        answer:`Группа ${r.label}: ${chosen?'выбрана':'не выбрана'} (${r.words.map(w=>w.pre+'_'+w.post).join(', ')})`,
        correct:`Группа ${r.label}: ${same?'выбрать — во всех словах «'+r.words[0].a+'»':'не выбирать — буквы разные'}: ${filled(r)}`,
        explain:r.explain, h1:'Проверь по отдельности каждое слово группы: какая буква пропущена и по какому правилу?', h3:r.h3, focus:`Группа ${r.label}: ${r.words.map(w=>w.pre+'_'+w.post).join(', ')}`}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.rows.filter(r=>ans[r.id]).map(r=>r.label).join(', '),
  done:(task)=>`<div class="rows">${task.rows.map(r=>`<div class="rowpick done ${rowSame(r)?'yes':''}"><span class="rl">${esc(r.label)}</span><span class="rw">${r.words.map(w=>`${esc(w.pre)}<b>${esc(w.a)}</b>${esc(w.post)}`).join(', ')}</span><span class="rc">${rowSame(r)?'✓':''}</span></div>`).join('')}</div>`
};

/* ---------- read: документ, который нужно прочитать и приобщить к делу (без языкового задания) ---------- */
T.read = {
  render(task, el){ el.innerHTML=E.renderDoc(task.doc); },
  ready:()=>true, missing:()=>({text:''}),
  check:()=>({ok:true, issues:[]}),
  value:()=> 'прочитано',
  done:(task)=>E.renderDoc(task.doc)
};
E.renderDoc = function(d){
  if(d.kind==='letter') return `<div class="letter-copy"><div class="lc-paper">${d.lines.map(l=>`<p>${esc(l)}</p>`).join('')}<p class="lc-sign">${esc(d.sign)}</p></div>${d.margin?`<div class="lc-margin">${esc(d.margin)}</div>`:''}</div>`;
  if(d.kind==='newspaper') return `<div class="clip"><div class="clip-head"><b>${esc(d.paper)}</b><span>${esc(d.date)}</span></div><h4>${esc(d.title)}</h4>${d.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
  if(d.kind==='protocol') return `<div class="protocol"><div class="p-head">${esc(d.head)}</div><div class="p-sub">${esc(d.sub)}</div>${d.paras.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="p-sign">${esc(d.sign)}</p></div>`;
  return `<div class="doctext">${(d.paras||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
};

/* ---------- commas: нужна ли запятая (для «Исправить дело» и эпизодов) ---------- */
T.commas = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="decide">${task.items.map((it,i)=>`<div class="decide-row ${o.hl===it.id?'hl':''}">
      <span class="n">${i+1}</span>
      <div class="seg" role="group"><button type="button" data-s="${it.id}" data-v="1" aria-pressed="${ans[it.id]===true}">${task.mark==='.'?'Здесь конец предложения':'Запятая нужна'}</button><button type="button" data-s="${it.id}" data-v="0" aria-pressed="${ans[it.id]===false}">${task.mark==='.'?'Предложение продолжается':'Не нужна'}</button></div>
      <div class="csent">${esc(it.before)}<span class="q">${ans[it.id]===true?(task.mark||','):ans[it.id]===false?'·':'?'}</span> ${esc(it.after)}</div>
    </div>`).join('')}</div>`;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ ans[b.dataset.s]=b.dataset.v==='1'; T.commas.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>task.items.every(it=>ans[it.id]!=null),
  missing:(task,ans)=>({text:'Реши про каждое предложение: нужна запятая или нет.', ref:(task.items.find(it=>ans[it.id]==null)||{}).id}),
  check(task, ans){
    const issues=[];
    task.items.forEach(it=>{ if(ans[it.id]!==it.need) issues.push({kind:'n16',key:it.id,ref:it.id,skill:it.skill,
      answer:`${it.before}${ans[it.id]?(task.mark||','):''} ${it.after}`, correct:`${it.before}${it.need?(task.mark||','):''} ${it.after}`, explain:it.explain, h3:it.h3, focus:task.mark==='.'?'Граница предложений':'Нужна ли запятая'}); });
    return {ok:!issues.length, issues};
  },
  value:()=> '',
  done:(task)=>`<div class="decide">${task.items.map(it=>`<div class="decide-row"><span class="n">✓</span><span style="font-family:var(--f-serif)">${esc(it.before)}${it.need?(task.mark||','):''} ${esc(it.after)}</span></div>`).join('')}</div>`
};

/* ---------- captions: найди ошибку в автоматической расшифровке ---------- */
const clean = w => w.replace(/[.,!?:;«»"—]/g,'');
T.captions = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="caps">${task.lines.map(ln=>{ const a=ans[ln.id]||{}; const toks=ln.text.split(' ');
      return `<div class="capline ${o.hl===ln.id?'hl':''}"><span class="ts">${esc(ln.ts)}</span>
        <div class="capwords">${toks.map((w,i)=>`<button type="button" data-l="${ln.id}" data-i="${i}" aria-pressed="${a.pick===i}">${esc(w)}</button>`).join(' ')}</div>
        <div class="capctl"><button type="button" class="chipb" data-none="${ln.id}" aria-pressed="${a.pick===-1}">Ошибки нет</button>
          ${a.pick>=0?`<label class="mono" style="color:#6A675F">как правильно: <input data-fix="${ln.id}" value="${esc(a.fix||'')}" autocomplete="off" spellcheck="false"></label>`:''}</div>
      </div>`; }).join('')}</div>`;
    el.querySelectorAll('.capwords button').forEach(b=>b.onclick=()=>{ const id=b.dataset.l, i=+b.dataset.i; const ln=task.lines.find(x=>x.id===id);
      ans[id]={pick:i, fix:clean(ln.text.split(' ')[i])}; T.captions.render(task,el,ans,o); o.onChange();
      const inp=el.querySelector(`input[data-fix="${id}"]`); if(inp){ inp.focus(); inp.select(); } });
    el.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{ ans[b.dataset.none]={pick:-1,fix:''}; T.captions.render(task,el,ans,o); o.onChange(); });
    el.querySelectorAll('input[data-fix]').forEach(i=>i.oninput=()=>{ ans[i.dataset.fix].fix=i.value; o.onChange(); });
  },
  ready:(task,ans)=>task.lines.every(ln=>ans[ln.id]&&ans[ln.id].pick!=null&&(ans[ln.id].pick===-1||ans[ln.id].fix.trim())),
  missing:(task,ans)=>{ const ln=task.lines.find(l=>!(ans[l.id]&&ans[l.id].pick!=null));
    if(ln) return {text:'В каждой строке выбери слово с ошибкой — или нажми «Ошибки нет».', ref:ln.id};
    const l2=task.lines.find(l=>ans[l.id].pick>=0&&!ans[l.id].fix.trim()); return {text:'Впиши, как правильно пишется выбранное слово.', ref:l2&&l2.id}; },
  check(task, ans){
    const issues=[];
    task.lines.forEach(ln=>{ const a=ans[ln.id]; const toks=ln.text.split(' ');
      const picked = a.pick>=0 ? `«${clean(toks[a.pick])}» → «${a.fix.trim()}»` : '«Ошибки нет»';
      if(ln.err){ const ei=toks.findIndex(w=>E.norm(clean(w))===E.norm(ln.err.word));
        if(!(a.pick===ei && E.norm(a.fix)===E.norm(ln.err.fix))) issues.push({kind:'n9',key:ln.id,ref:ln.id,skill:ln.err.skill,
          answer:`${ln.ts}: ${picked}`, correct:`${ln.ts}: «${ln.err.word}» → «${ln.err.fix}»`, explain:ln.err.explain,
          h1:'Перечитай строку медленно и проверь корни слов.', h3:ln.err.h3, focus:`Строка субтитров ${ln.ts}`});
      } else if(a.pick!==-1){ issues.push({kind:'n9',key:ln.id,ref:ln.id,skill:ln.trap.skill,
          answer:`${ln.ts}: ${picked}`, correct:`${ln.ts}: «Ошибки нет»`, explain:ln.trap.explain,
          h1:'Перечитай строку медленно и проверь корни слов.', h3:'В этой строке проверь выбранное слово по правилу: возможно, оно написано верно.', focus:`Строка субтитров ${ln.ts}`}); }
    });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.lines.map(ln=>{ const a=ans[ln.id]||{}; if(!(a.pick>=0)) return ln.text; const t=ln.text.split(' '); t[a.pick]=a.fix; return t.join(' '); }).join(' / '),
  done:(task)=>`<div class="caps">${task.lines.map(ln=>`<div class="capline"><span class="ts">${esc(ln.ts)}</span><div class="capwords">${esc(ln.err?ln.text.replace(ln.err.word,ln.err.fix):ln.text)}</div></div>`).join('')}</div>`
};

/* ---------- proof: вычитка текста — поставить запятую или нет в отмеченных местах ---------- */
const paras = (text, fn) => text.split('\n\n').map(p=>`<p style="margin:0 0 12px">${E.fillTokens(p, fn)}</p>`).join('');
T.proof = {
  render(task, el, ans, o){
    el.innerHTML=`<div class="doctext">${paras(task.text, id=>{ const v=ans[id];
      return `<button type="button" class="slot ${v===true?'on':v===false?'off':''} ${o.hl===id?'hl':''}" data-k="${id}" aria-label="Место для знака: ${v===true?'запятая':v===false?'без знака':'не решено'}">${v===true?',':v===false?'':'?'}</button>`; })}</div>
      <p class="mono" style="color:var(--ink-muted)">Нажатие: «?» → «,» → пусто (знак не нужен) → «,»</p>`;
    el.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; ans[k] = ans[k]===true ? false : true; T.proof.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>Object.keys(task.slots).every(k=>ans[k]!=null),
  missing:(task,ans)=>({text:'Реши про каждое отмеченное место: запятая или без знака. Осталось: '+Object.keys(task.slots).filter(k=>ans[k]==null).length+'.', ref:Object.keys(task.slots).find(k=>ans[k]==null)}),
  sentence(task, k, withComma){
    const p=task.text.split('\n\n').find(x=>x.includes(`[[${k}]]`));
    const sents=p.split(/(?<=[.!?])\s+/); const s=sents.find(x=>x.includes(`[[${k}]]`));
    return s.replace(/\[\[(\w+)\]\]/g,(m,id)=> id===k ? (withComma?',':'') : (task.slots[id].need?',':''));
  },
  check(task, ans){
    const issues=[];
    Object.entries(task.slots).forEach(([k,sl])=>{ if(ans[k]!==sl.need) issues.push({kind:'n16',key:k,ref:k,skill:sl.skill,
      answer:T.proof.sentence(task,k,ans[k]), correct:T.proof.sentence(task,k,sl.need), explain:sl.explain, h3:sl.h3, focus:'Вычитка черновика'}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.text.replace(/\[\[(\w+)\]\]/g,(m,k)=>ans[k]?',':''),
  done:(task)=>`<div class="doctext">${paras(task.text, k=>task.slots[k].need?'<b style="color:#3F7A4C">,</b>':'')}</div>`
};

/* ---------- sort: определи тип орфограммы и выбери букву ---------- */
const RULES = [['prov','Проверяемая'],['slovar','Словарное слово'],['cher','Чередование']];
T.sort = {
  render(task, el, ans, o){
    const text=paras(task.text, id=>{ const w=task.words[id]; const a=ans[id]||{};
      return `<span class="wd ${o.hl===id?'hl':''}">${esc(w.pre)}<span class="gap-slot">${esc(a.l||'_')}</span>${esc(w.post)}</span>`; });
    const rows=Object.entries(task.words).map(([id,w])=>{ const a=ans[id]||{};
      return `<div class="sortrow ${o.hl===id?'hl':''}">
        <span class="w">${esc(w.pre)}<span class="gap-slot">${esc(a.l||'_')}</span>${esc(w.post)}</span>
        <span class="pick">${w.opts.map(l=>`<button type="button" data-w="${id}" data-l="${l}" aria-pressed="${a.l===l}">${l}</button>`).join('')}</span>
        <span class="bins">${RULES.map(([r,lab])=>`<button type="button" data-w="${id}" data-r="${r}" aria-pressed="${a.rule===r}">${lab}</button>`).join('')}</span>
      </div>`; }).join('');
    el.innerHTML=`<div class="hand">${text}</div><div class="sortbox">${rows}</div>`;
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ const a=ans[b.dataset.w]=ans[b.dataset.w]||{}; a.l=b.dataset.l; T.sort.render(task,el,ans,o); o.onChange(); });
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const a=ans[b.dataset.w]=ans[b.dataset.w]||{}; a.rule=b.dataset.r; T.sort.render(task,el,ans,o); o.onChange(); });
  },
  ready:(task,ans)=>Object.keys(task.words).every(id=>ans[id]&&ans[id].l&&ans[id].rule),
  missing:(task,ans)=>{ const id=Object.keys(task.words).find(k=>!(ans[k]&&ans[k].l&&ans[k].rule)); return {text:'Для каждого слова выбери и тип орфограммы, и букву.', ref:id}; },
  check(task, ans){
    const issues=[]; const lab=r=>(RULES.find(x=>x[0]===r)||[0,'—'])[1];
    Object.entries(task.words).forEach(([id,w])=>{ const a=ans[id]||{}; const word=w.pre+'…'+w.post;
      if(a.rule!==w.rule) issues.push({kind:'n9',key:id+':rule',ref:id,skill:w.skill,word,
        answer:`${w.pre}_${w.post}: «${lab(a.rule)}»`, correct:`${w.pre}_${w.post}: «${lab(w.rule)}»`, explain:w.explain,
        h1:'Подумай, что это за орфограмма: можно ли подобрать проверочное слово? Или гласная зависит от чего-то другого?', h3:w.h3, focus:`Тип орфограммы в слове «${word}»`});
      if(E.norm(a.l||'')!==w.a) issues.push({kind:'n9',key:id+':letter',ref:id,skill:w.skill,word,
        answer:w.pre+(a.l||'_')+w.post, correct:w.pre+w.a+w.post, explain:w.explain, h3:w.h3, focus:`Буква в корне слова «${word}»`}); });
    return {ok:!issues.length, issues};
  },
  value:(task,ans)=>task.text.replace(/\[\[(\w+)\]\]/g,(m,id)=>{ const w=task.words[id]; return w.pre+((ans[id]||{}).l||'_')+w.post; }),
  done:(task)=>`<div class="hand">${paras(task.text, id=>{ const w=task.words[id]; return `<span class="wd">${esc(w.pre)}<b style="color:#3F7A4C">${esc(w.a)}</b>${esc(w.post)}</span>`; })}</div>`
};

/* ---------- transcribe: самостоятельная стенограмма ---------- */
T.transcribe = {
  render(task, el, ans, o){
    el.innerHTML=`<textarea class="input" placeholder="Запиши так, как слышишь, — со всеми знаками препинания" spellcheck="false" autocomplete="off">${esc(ans.text||'')}</textarea>
      <div class="mono">${E.tokenize(task.text).words.length} слов в записи</div>`;
    const ta=el.querySelector('textarea'); ta.oninput=()=>{ ans.text=ta.value; o.onChange(); };
  },
  ready:(task,ans)=>!!(ans.text&&ans.text.trim()),
  missing:()=>({text:'Сначала запиши то, что услышал.'}),
  check:(task,ans)=>E.checkTranscript(task, ans.text||''),
  visual:(task,res,is)=>res.U?`<div class="echo">${E.echoHTML(res,is)}</div>`:'',
  value:(task,ans)=>(ans.text||'').trim(),
  done:(task)=>`<div class="quote-ok">«${esc(task.text)}»</div>`
};

/* =====================================================================
   runTask — общий цикл: сверить → (ошибка → подсказки по запросу | черновик) → подтверждение
   ctx: { fix:bool, skills:[…] (для РНО), onConfirm, onLeave, audio:bool }
   ===================================================================== */
E.runTask = function(task, host, ctx){
  ctx=ctx||{};
  const ui=T[task.type];
  const mat = ctx.fix ? null : E.S.mat[task.mat];
  const ans = ctx.fix ? (E.S.fixAns[task.id]=E.S.fixAns[task.id]||{}) : mat.answers;
  if(!ctx.fix && !E.S.found[task.mat]){ E.S.found[task.mat]=true; E.save(); setTimeout(()=>E.refreshChrome&&E.refreshChrome(),0); }   // материал появился перед игроком — теперь он в «Деле»
  let res=null, level=0, hkey=null;
  host.innerHTML=`<div class="task" style="display:grid;gap:12px">
    ${task.prompt?`<p class="${ctx.light?'':'lead'}" style="${ctx.light?'color:var(--ink-muted);font-size:14px':''}">${esc(task.prompt)}</p>`:''}
    <div class="task-work"></div><div class="task-ctl row"></div><div class="task-fb"></div></div>`;
  const work=host.querySelector('.task-work'), ctl=host.querySelector('.task-ctl'), fb=host.querySelector('.task-fb');
  const drawWork = hl => { ui.render(task, work, ans, {hl, onChange}); if(ctx.onHl) ctx.onHl(hl); };
  // кнопка «Сверить» всегда активна: если заполнено не всё — объясняем, чего не хватает
  function onChange(){ E.save(); if(fb.querySelector('.fb-missing') && ui.ready(task,ans)) fb.innerHTML=''; }
  function isDone(){ return ctx.fix ? !!E.S.fixDone[task.id] : mat.status==='confirmed'; }
  function draw(stampAnim){
    if(isDone()){
      work.innerHTML=ui.done(task, ans); ctl.innerHTML='';
      const typos = !ctx.fix && mat.typos && mat.typos.length ? `<p class="typo">Опечатки поправлены автоматически и на подтверждение не влияют: ${mat.typos.map(t=>`«${esc(t.was)}» → «${esc(t.is)}»`).join(', ')}.</p>`:'';
      fb.innerHTML=`<div class="confirmed"><span class="stamp big ${stampAnim?'hit':''}">${ctx.fix?'Навык подтверждён':(task.doneLabel||'Подтверждено')}</span>${typos}</div>`;
      ctx.afterDone && ctx.afterDone(fb, stampAnim);
      return;
    }
    drawWork(null);
    const draft = !ctx.fix && mat.status==='draft';
    ctl.innerHTML=`<button class="btn primary check">${task.checkLabel||(task.audio?'Подтвердить стенограмму':'Сверить')}</button>${draft?'<span class="pill draft">черновик · можно перепроверить</span>':''}`;
    ctl.querySelector('.check').onclick=onCheck; onChange();
  }
  function onCheck(){
    if(!ui.ready(task,ans)){ const m=ui.missing(task,ans);
      fb.innerHTML=`<div class="fb fb-missing"><h4>Ещё не всё</h4><p>${esc(m.text)}</p></div>`; drawWork(m.ref||null); return; }
    res=ui.check(task, ans);
    if(res.empty) return;
    if(res.ok){ confirm(); return; }
    res.issues.forEach(is=>E.logIssue(task, is, ctx));
    const p=res.issues[0]; if(hkey!==p.key){ hkey=p.key; level=0; }
    E.save(); drawWork(null); drawFb(false);
  }
  function drawFb(withHint){
    const p=res.issues[0];
    const hint = withHint&&level ? `<div class="hint"><span class="lvl">подсказка ${level} из 3</span><p>${esc(E.hintText(p,level))}</p>${level>=2&&ui.visual?ui.visual(task,res,p):''}</div>`:'';
    fb.innerHTML=`<div class="fb"><h4>${task.audio?'Стенограмма пока не подтверждена':V16.UI.failTitle}</h4>
      <p>${task.audio?V16.UI.failTextAudio:V16.UI.failText}</p>${hint}
      <div class="row"><button class="btn primary re">${V16.UI.recheck}</button>
      <button class="btn hn" ${level>=3?'disabled':''}>${level>=3?V16.UI.hintNone:level?V16.UI.hintNext:V16.UI.hint}</button>
      ${ctx.fix?'':`<button class="btn ghost lv">${V16.UI.leave}</button>`}</div></div>`;
    fb.querySelector('.re').onclick=()=>{ fb.innerHTML=''; drawWork(null); const f=work.querySelector('input,textarea,button'); if(f) f.focus(); };
    fb.querySelector('.hn').onclick=()=>{ level=Math.min(3,level+1); E.noteHint(task,p,level,ctx); E.save(); drawWork(level>=2?p.ref:null); drawFb(true); };
    const lv=fb.querySelector('.lv'); if(lv) lv.onclick=()=>{ mat.status='draft'; mat.value=ui.value(task,ans); E.save(); E.refreshChrome(); ctx.onLeave&&ctx.onLeave(); };
  }
  function confirm(){
    if(ctx.fix){ E.S.fixDone[task.id]=true; E.S.archive.forEach(e=>{ if(ctx.skills.includes(e.skill)) e.fixed=true; }); }
    else { mat.status='confirmed'; mat.value=ui.value(task,ans); mat.typos=res.typos||[]; }
    E.save(); E.refreshChrome(); draw(true); ctx.onConfirm&&ctx.onConfirm();
  }
  draw(false);
};
})();
/* =====================================================================
   ВЫПУСК-16 · ДВИЖОК · ЭКРАНЫ (A)
   Рабочее место: шапка (Стол · Доска · Выпуск, Дело, Архив), выпуски, вступление,
   стол с физическими предметами, дневник, памятка, письмо, фото, записка.
   ===================================================================== */
(function(){
"use strict";
const E=V16.engine, esc=E.esc;
E.VIEWS = {};
const app = () => document.getElementById('app');

/* ---------- статусы и условия ---------- */
E.matStatus = id => E.S.mat[id] ? E.S.mat[id].status : 'none';
E.whenOk = function(w, epId){
  if(!w || w.always) return true;
  const P=E.S.eps[epId||E.EP.id];
  if(w.any) return w.any.some(x=>E.whenOk(x,epId));
  if(w.mat) return E.matStatus(w.mat)!=='none';
  if(w.visited) return !!P.visited[w.visited];
  if(w.opened) return !!P.opened[w.opened];
  if(w.flag) return !!E.S.flags[w.flag];
  if(w.all) return w.all.every(x=>E.whenOk(x,epId));
  if(w.found) return E.isFound(w.found);
  if(w.links) return E.S.links.filter(l=>l.ep===(epId||E.EP.id)).length>=w.links;   // новые нити эпизода
  if(w.version) return !!P.version.done;
  return false;
};
E.itemLocked = (it, ep) => !!it.lock && !E.whenOk(it.lock, ep);
E.itemDone = (it, ep) => it.mats ? it.mats.every(m=>E.matStatus(m)!=='none') : !!E.S.eps[ep||E.EP.id].opened[it.id];
const reqItems = () => E.EP.desk.items.filter(i=>i.required);
const visibleReq = () => reqItems().filter(i=>!(i.hidden && E.itemLocked(i)));
E.visibleReq = visibleReq;
const epLinks = () => E.S.links.filter(l=>l.ep===E.EP.id).length;
const prevDone = () => { const i=E.epIndex(E.EP.id); return i>0 && E.S.eps[V16.GAME.order[i-1]].version.done; };
E.gate = {
  board:   () => reqItems().every(i=>E.itemDone(i)) || prevDone(),
  facts:   () => reqItems().every(i=>E.itemDone(i)) && epLinks() >= E.EP.board.minLinks,
  version: () => E.P().facts.checked,
  archive: () => E.S.archive.length>0 || V16.GAME.order.some(id=>E.S.eps[id].version.done)
};

/* ---------- физические предметы стола ----------
   Предмет собирается из частей всех открытых эпизодов (до текущего включительно). */
E.deskObjects = function(){
  const upto=E.epIndex(E.EP.id); const out=[];
  Object.entries(V16.OBJECTS).forEach(([key,O])=>{
    const parts=[];
    V16.GAME.order.forEach((ep,i)=>{ if(i>upto) return; V16.EPISODES[ep].desk.items.filter(it=>it.obj===key && !(it.hidden && E.itemLocked(it,ep))).forEach(it=>parts.push({ep, item:it})); });   // скрытые находки не существуют, пока не открыты
    if(parts.length) out.push({ key, title:O.title, scene:O.scene, parts });
  });
  return out;
};
E.objByKey = key => E.deskObjects().find(o=>o.key===key);
E.objOfMat = m => { const ep=E.MAT_EP[m]; const it=V16.EPISODES[ep].desk.items.find(i=>(i.mats||[]).includes(m)); return it && it.obj; };
E.openParts = o => o.parts.filter(p=>!E.itemLocked(p.item,p.ep));          // части, доступные сейчас
E.objMats = o => E.openParts(o).flatMap(p=>p.item.mats||[]);
E.objState = function(o){
  const act=o.parts.filter(p=>p.ep===E.EP.id);
  if(!o.parts.some(p=>p.item.mats)) return E.S.eps[o.parts[0].ep].opened[o.parts[0].item.id] ? ['осмотрено','ok'] : ['не осмотрено','none'];
  const mats=E.objMats(o), st=mats.map(E.matStatus);
  const actMats=act.filter(p=>!E.itemLocked(p.item,p.ep)).flatMap(p=>p.item.mats||[]);
  if(act.length && act.every(p=>E.itemLocked(p.item,p.ep)) && st.every(s=>s!=='none')) return ['новое позже','none'];
  if(act.some(p=>!E.itemLocked(p.item,p.ep) && (p.item.mats||[]).length && p.item.mats.every(m=>E.matStatus(m)==='none') && (p.item.hidden || o.parts.some(x=>x!==p)))) return ['есть новое','new'];   // новое содержимое старого предмета или сюжетная находка
  if(st.length && st.every(s=>s==='confirmed')) return [act.length?'подтверждено':'изучено','ok'];
  if(st.length && st.every(s=>s!=='none')) return ['есть черновик','draft'];
  if(st.some(s=>s!=='none')) return ['в работе','draft'];
  return ['не открыто','none'];
};

/* ---------- навигация ---------- */
const WORKSPACES=['desk','board','vypusk','facts','version','end','final','intro','episodes','archive','fixitem'];
E.go = function(view, param){
  E.stopAudio(); drawer.hidden=true;
  if(WORKSPACES.includes(view) && E.S.active && E.EP.id!==E.S.active) E.switchEp(E.S.active);
  E.S.view=view; E.S.param=param==null?null:param;
  E.save(); E.render(); window.scrollTo({top:0});
};
const TABS=[['desk','Стол'],['board','Доска'],['vypusk','Выпуск']];
const lockIcon='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1" fill="currentColor"/><path d="M4 5V3.6a2 2 0 0 1 4 0V5" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>';
E.refreshChrome = function(){
  const tabs=document.getElementById('tabs'); if(!tabs) return;
  if(E.checkTriggers) E.checkTriggers();
  const v=E.S.view, hidden=(v==='intro'||v==='episodes');
  const cur = v==='scene'?'desk' : ['facts','version','end'].includes(v)?'board' : v==='final'?'vypusk' : v;
  document.getElementById('epName').textContent=`${E.EP.short} · ${E.EP.title} ▾`;
  tabs.innerHTML = hidden ? '' : TABS.map(([id,l])=>{ const open = id!=='board' || E.gate.board();

E.openMaterial = function(matId){

E.VIEWS.scene_diary = function(o){
  const U=E.S.ui, mats=E.objMats(o); const avail=i=> i===0 || E.matStatus(mats[i-1])!=='none';
  let cur=U.diaryEntry && mats.includes(U.diaryEntry) ? U.diaryEntry : (mats.find(m=>E.matStatus(m)==='none')||mats[mats.length-1]);
  if(!avail(mats.indexOf(cur))) cur=mats[0];
  const idx=mats.indexOf(cur); const task=E.taskOfMat(cur); if(task.type!=='sort') task.hand=true;
  const last=idx===mats.length-1;
  const locked=o.parts.filter(p=>E.itemLocked(p.item,p.ep));
  app().innerHTML=`<div class="head"><div>${backBtn('desk',E.backLabel())}<div class="label">Страницы в разводах</div><h2>${esc(o.title)}</h2></div></div>
  <section class="notebook">
    <nav class="nb-index" aria-label="Записи">${mats.map((m,i)=>{ const t=E.taskOfMat(m);
      return `<button class="nb-entry" data-m="${m}" ${avail(i)?'':'disabled'} aria-current="${m===cur}"><b>${esc(t.date)}</b>${avail(i)?statusPill(E.matStatus(m)):'<span class="mono" style="color:var(--ink-muted)">размыто</span>'}</button>`; }).join('')}
      ${locked.map(p=>`<span class="mono" style="color:var(--ink-muted);padding:8px 10px">${esc(p.item.lockText||'')}</span>`).join('')}</nav>
    <div class="nb-page"><div id="taskHost"></div><div id="afterHost" style="margin-top:14px"></div>
      <div class="row" style="margin-top:18px;justify-content:space-between">
        <button class="btn small ghost" style="color:var(--ink);border-color:#BDB29A" id="prev" ${idx>0?'':'disabled'}>← Предыдущая запись</button>
        <button class="btn small" style="background:#2E4056;color:#F1ECE1;border-color:#2E4056" id="next" ${E.matStatus(cur)!=='none'?'':'disabled'} title="${E.matStatus(cur)!=='none'?'':'Сначала сверь эту запись или оставь её черновиком'}">${last?'Дневник разобран — '+esc(E.backLabel().toLowerCase())+' →':'Следующая запись →'}</button>
      </div></div>
  </section>`;
  E.wireBack(app());
  const again=()=>E.VIEWS.scene_diary(o);
  app().querySelectorAll('.nb-entry').forEach(b=>b.onclick=()=>{ U.diaryEntry=b.dataset.m; E.save(); again(); });
  document.getElementById('prev').onclick=()=>{ U.diaryEntry=mats[idx-1]; E.save(); again(); };
  document.getElementById('next').onclick=()=>{ if(!last){ U.diaryEntry=mats[idx+1]; E.save(); again(); return; } E.returnToDesk(); };
  E.runTask(task, document.getElementById('taskHost'), {
    light:true,
    afterDone:(fb,anim)=>{ const nb=document.getElementById('next'); if(nb){ nb.disabled=false; nb.title=''; }
      document.getElementById('afterHost').innerHTML=`<div class="paper ${anim?'appear':''}" style="padding:12px 14px;box-shadow:none;border:1px solid #BDB29A;background:#F4EEDF"><div class="label" style="color:var(--ink-muted)">улика на доске</div><div style="font-family:var(--f-serif)">${esc(task.quote)}</div></div>`; },
    onConfirm:()=>setTimeout(()=>{ if(E.S.view==='scene'&&E.S.param===o.key) again(); },1100),
    onLeave:again
  });
  if(E.matStatus(cur)==='draft') document.getElementById('afterHost').innerHTML=`<p class="draftnote">Запись оставлена черновиком. На доске улика появится с пометкой «черновик».</p>`;
};

/* Общий каркас «фрагменты + стенограмма»: и для кассеты, и для интервью */
function fragmentScene(o, cfg){
  const P=E.S.ui, played=id=>!!E.S.eps[E.MAT_EP[E.findTask(id).mat]].played[id];
  const tasks=E.objMats(o).map(E.taskOfMat);
  const avail=i=> i===0 || E.matStatus(tasks[i-1].mat)!=='none';
  let cur=tasks.find(t=>t.id===P[cfg.stateKey]) || tasks.find(t=>E.matStatus(t.mat)==='none') || tasks[tasks.length-1];
  if(!avail(tasks.indexOf(cur))) cur=tasks[0];
  // несколько собеседников в одном предмете: «Фрагмент 1» → «Денис · 1»
  const multi=new Set(tasks.map(t=>E.MAT_EP[t.mat])).size>1;
  const tabName=t=>{ if(!multi || !/^Фрагмент /.test(t.title)) return t.title; const I=t.speaker||V16.EPISODES[E.MAT_EP[t.mat]].interview; return I ? I.name.split(' ')[0]+' · '+t.title.replace('Фрагмент ','') : t.title; };
  const idx=tasks.indexOf(cur); const isPlayed=played(cur.id); const PP=E.S.eps[E.MAT_EP[cur.mat]].played;
  app().innerHTML=`<div class="head"><div>${E.backBtn('desk',E.backLabel())}<div class="label">${esc(cfg.label(cur))}</div><h2>${esc(o.title)}</h2></div>
    <div class="fragtabs">${tasks.map((t,i)=>`<button class="toggle" data-f="${t.id}" aria-pressed="${t===cur}" ${avail(i)?'':'disabled'}>${esc(tabName(t))}</button>`).join('')}</div></div>
  <section class="scene">
    <div>${cfg.stage(cur, isPlayed)}
      <p class="mono" id="novoice" hidden style="margin-top:10px">Браузер не нашёл русский голос: будет слышен только фон. Для проверки можно <button class="toggle" id="reveal">показать реплику текстом</button></p></div>
    <div class="card-box"><h3>Стенограмма</h3><div id="taskHost"></div><div id="afterHost"></div></div>
  </section>`;
  E.wireBack(app());
  app().querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ P[cfg.stateKey]=b.dataset.f; E.go('scene', o.key); });
  const ui=cfg.wire(cur);
  const slow=document.getElementById('kSlow'); slow.onclick=()=>{ const on=slow.getAttribute('aria-pressed')!=='true'; slow.setAttribute('aria-pressed',on); slow.classList.toggle('on',on); };
  async function play(keyOnly){
    if(!E.hasVoice()) document.getElementById('novoice').hidden=false;
    ui.running(true);
    const cues = keyOnly ? [...(cfg.noHiss?[]:[{t:'noise',ms:500,cap:'[ шум плёнки ]'}]), ...cur.cues.filter(c=>c.key)] : cur.cues;
    const ok = await E.playCues(cues, { rate: slow.getAttribute('aria-pressed')==='true' ? .72 : 1, caption:ui.caption, level:ui.level, look:ui.look, noHiss:cfg.noHiss });
    ui.running(false);
    if(!ok) return;
    ui.caption(keyOnly ? 'реплика прослушана' : cfg.endText);
    if(!PP[cur.id]){ PP[cur.id]=true; E.save(); document.getElementById('kKey').disabled=false; steno(); }
  }
  document.getElementById('kPlay').onclick=()=>play(false);
  document.getElementById('kKey').onclick=()=>play(true);
  document.getElementById('kStop').onclick=()=>{ E.stopAudio(); ui.running(false); ui.caption('остановлено'); };
  document.getElementById('reveal').onclick=()=>ui.caption(cur.text);
  const goNext=nx=>{ P[cfg.stateKey]=nx.id; E.go('scene', o.key); };
  function steno(){
    const host=document.getElementById('taskHost'), ah=document.getElementById('afterHost');
    if(!PP[cur.id]){ host.innerHTML=`<div class="locked">${esc(cfg.lockedText)}</div>`; return; }
    E.runTask(cur, host, {
      afterDone:(fb,anim)=>{ const nx=tasks[idx+1]; ah.innerHTML='';
        if(nx){ const b=document.createElement('div'); b.className='row'+(anim?' appear':''); b.style.marginTop='12px';
          b.innerHTML=`<button class="btn primary">Дальше: ${esc(nx.title)} →</button>`; b.querySelector('button').onclick=()=>goNext(nx); ah.appendChild(b); }
        else E.nextStepButton(ah, anim); },
      onLeave:()=>{ const nx=tasks[idx+1]; if(nx) P[cfg.stateKey]=nx.id; E.go('scene', o.key); }
    });
    if(E.matStatus(cur.mat)==='draft'){ const nx=tasks[idx+1];
      ah.innerHTML=`<p class="draftnote" style="margin-top:10px">Стенограмма оставлена черновиком.</p>`;
      if(nx){ const b=document.createElement('button'); b.className='btn ghost'; b.style.marginTop='8px'; b.textContent=`Дальше: ${nx.title} →`; b.onclick=()=>goNext(nx); ah.appendChild(b); }

}

/* ---------- ДОСКА: отрисовка и управление ---------- */
let freshLink=-1, unbindBoard=null;
function boardHeight(cards){ return Math.max(GB.minHeight, ...cards.map(({id})=>posOf(id)[1]+280)); }
function boardUI(withNote){
  const cards=allCards(); const seen=E.S.seenCards; const focus=E.S.board.focus||'all';
  const eps=[...new Set(cards.map(x=>x.ep))];
  const html=cards.map(x=>{ const f=!seen[x.id]; seen[x.id]=1; return cardHTML(x,f, focus!=='all'&&x.ep!==focus); }).join('');
  E.save();
  const lastDone=[...V16.GAME.order].reverse().find(id=>E.S.eps[id].version.done && E.epIndex(id)<=E.epIndex(E.EP.id));
  const note = withNote && lastDone ? (()=>{ const v=E.S.eps[lastDone].version; return `<div class="sticky"><b>ВЕРСИЯ ДЕЛА · ЭПИЗОД ${V16.EPISODES[lastDone].number}</b>Не доверяем: ${esc(v.distrust.join(', ')||'—')}<br><br>Открытый вопрос: ${esc(v.question||'—')}</div>`; })() : '';
  return `<div class="board-ui">
    <div class="board-tools">
      <div class="seg-tabs zoom"><button data-z="-" aria-label="Уменьшить">−</button><button data-z="fit">Вписать</button><button data-z="+" aria-label="Увеличить">+</button></div>
      <span class="mono" id="zoomVal"></span>
      ${eps.length>1?`<div class="seg-tabs"><button data-focus="all" aria-pressed="${focus==='all'}">Все карточки</button>${eps.map(ep=>`<button data-focus="${ep}" aria-pressed="${focus===ep}">Эпизод ${V16.EPISODES[ep].number}</button>`).join('')}</div>`:''}
      <span class="mono tools-hint">тяни фон, чтобы двигать доску</span>
    </div>
    ${E.S.flags.boardHint?'':'<div class="board-hint appear" id="bHint"><span>Перетаскивай карточки, чтобы собрать доску по-своему. Нажми на две карточки, чтобы связать их.</span><button class="toggle" id="bHintX">понятно</button></div>'}
    <div class="board-view" id="bview"><div class="board-space" id="bspace"><div class="board" id="board" style="width:${GB.width}px;height:${boardHeight(cards)}px">
      <svg class="threads" id="threads"></svg>${html}<div id="tags"></div></div></div></div>
    ${note}<div id="popHost"></div>
  </div>`;
}
function applyZoom(){
  const view=document.getElementById('bview'), space=document.getElementById('bspace'), board=document.getElementById('board'); if(!view) return;
  const fit=()=>Math.max(.3, Math.min(1, (view.clientWidth-8)/GB.width));
  if(E.S.board.zoom==null || !(E.S.board.zoom>=.3)){ if(view.clientWidth<60) return; E.S.board.zoom=fit(); }
  const z=E.S.board.zoom; board.style.transform=`scale(${z})`;
  space.style.width=GB.width*z+'px'; space.style.height=board.offsetHeight*z+'px';
  document.getElementById('zoomVal').textContent=Math.round(z*100)+'%';
}
function drawThreads(){
  const board=document.getElementById('board'); if(!board) return; const svg=document.getElementById('threads'), tags=document.getElementById('tags');
  const focus=E.S.board.focus||'all';
  const c=id=>{ const el=board.querySelector(`.card[data-id="${id}"]`); if(!el) return null; const p=posOf(id); return [p[0]+el.offsetWidth/2, p[1]+Math.min(46,el.offsetHeight/2)]; };
  let paths='',th='';
  svg.setAttribute('width',board.offsetWidth); svg.setAttribute('height',board.offsetHeight);
  E.S.links.forEach((L,i)=>{
    const a=c(L.a), b=c(L.b); if(!a||!b) return;
    const draft=isDraftCard(L.a)||isDraftCard(L.b);
    const dim = focus!=='all' && cardEp(L.a)!==focus && cardEp(L.b)!==focus;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2+40;
    paths+=`<g opacity="${dim?.25:1}"><path class="${i===freshLink?'new':''}" d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" stroke="#B8402F" stroke-width="2.6" fill="none" ${draft&&i!==freshLink?'stroke-dasharray="7 6"':''} stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#7A2A1E"/><circle cx="${b[0]}" cy="${b[1]}" r="3.5" fill="#7A2A1E"/></g>`;
    const tx=(a[0]+2*mx+b[0])/4, ty=(a[1]+2*my+b[1])/4;
    th+=`<button class="tag ${draft?'draft':''} ${dim?'dim':''}" data-link="${i}" style="left:${tx}px;top:${ty}px">${esc(L.label)}${draft?'<small>черновик</small>':''}</button>`;
  });
  svg.innerHTML=paths; tags.innerHTML=th; freshLink=-1;
}
window.addEventListener('resize',()=>{ drawThreads(); applyZoom(); });

function wireBoard(onChange, rerender){
  const view=document.getElementById('bview'), board=document.getElementById('board'); let sel=null;
  applyZoom();
  const hx=document.getElementById('bHintX'); if(hx) hx.onclick=()=>{ E.S.flags.boardHint=true; E.save(); document.getElementById('bHint').remove(); };
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const z=E.S.board.zoom||1;
    E.S.board.zoom = b.dataset.z==='fit' ? Math.max(.3,Math.min(1,(view.clientWidth-8)/GB.width)) : Math.max(.3, Math.min(1.4, z+(b.dataset.z==='+'?.1:-.1)));
    E.save(); applyZoom(); });
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ E.S.board.focus=b.dataset.focus; E.save(); rerender(); });
  view.addEventListener('wheel',e=>{ if(!e.ctrlKey) return; e.preventDefault(); E.S.board.zoom=Math.max(.3,Math.min(1.4,(E.S.board.zoom||1)-e.deltaY*.0015)); applyZoom(); },{passive:false});
  // перетаскивание карточек и панорамирование фона
  let drag=null;
  view.addEventListener('pointerdown',e=>{
    if(e.button!==0 || e.target.closest('.tag')) return;
    const card=e.target.closest('.card');
    drag = card ? {type:'card', el:card, id:card.dataset.id, x:e.clientX, y:e.clientY, start:posOf(card.dataset.id).slice(), moved:false}
                : {type:'pan', x:e.clientX, y:e.clientY, sl:view.scrollLeft, st:view.scrollTop, moved:false};
  });
  if(unbindBoard) unbindBoard();
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  unbindBoard=()=>{ window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); };
  function onMove(e){ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.moved && Math.hypot(dx,dy)<5) return; drag.moved=true;
    if(drag.type==='pan'){ view.scrollLeft=drag.sl-dx; view.scrollTop=drag.st-dy; view.classList.add('panning'); return; }
    const z=E.S.board.zoom||1; const nx=Math.max(0,Math.min(GB.width-60, drag.start[0]+dx/z)), ny=Math.max(0, drag.start[1]+dy/z);
    E.S.cardPos[drag.id]=[Math.round(nx),Math.round(ny)]; drag.el.style.left=nx+'px'; drag.el.style.top=ny+'px'; drag.el.classList.add('dragging'); drawThreads(); }
  function onUp(){ if(!drag) return; const d=drag; drag=null; view.classList.remove('panning');
    if(!document.body.contains(view)) return;
    if(d.type==='card'){ d.el.classList.remove('dragging');
      if(d.moved){ if(!E.S.flags.boardHint){ E.S.flags.boardHint=true; const h=document.getElementById('bHint'); if(h) h.remove(); } E.save(); const h=boardHeight(allCards()); if(h>board.offsetHeight){ board.style.height=h+'px'; applyZoom(); } return; }
      clickCard(d.el); } }
  function clickCard(el){ const id=el.dataset.id;
    if(!sel){ sel=id; el.classList.add('sel'); return; }
    if(sel===id){ el.classList.remove('sel'); sel=null; return; }
    const a=sel; sel=null; board.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel')); openPop(a,id); }
  function openPop(a,b){
    const key=E.pairKey(a,b); const existing=E.S.links.find(l=>E.pairKey(l.a,l.b)===key); const li=existing?E.S.links.indexOf(existing):-1;
    let label=existing?existing.label:'';
    const labels=labelsFor(a,b); const own=label&&!labels.includes(label)?label:'';
    const host=document.getElementById('popHost');
    host.innerHTML=`<div class="pop" role="dialog" aria-label="Нить между карточками">
      <div class="label">${esc(cardName(a))} — ${esc(cardName(b))}</div><h3>Как это связано — по твоей версии?</h3>
      <div class="opts">${labels.map(l=>`<button class="opt" data-l="${esc(l)}" aria-pressed="${l===label}">${esc(l)}</button>`).join('')}</div>
      <input class="own" id="own" maxlength="28" placeholder="или своя подпись" value="${esc(own)}">
      <div class="row"><button class="btn primary" id="popOk" ${label?'':'disabled'}>${existing?'Обновить нить':'Натянуть нить'}</button><button class="btn ghost" id="popX">Отмена</button>${existing?'<button class="btn ghost" id="popDel">Убрать нить</button>':''}</div></div>`;
    const ok=host.querySelector('#popOk'), ownI=host.querySelector('#own');
    host.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ label=o.dataset.l; ownI.value=''; host.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o)); ok.disabled=false; });
    ownI.oninput=()=>{ const v=ownI.value.trim(); if(v){ label=v; host.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); } ok.disabled=!label; };
    host.querySelector('#popX').onclick=()=>host.innerHTML='';
    const del=host.querySelector('#popDel'); if(del) del.onclick=()=>{ E.S.links.splice(li,1); E.save(); host.innerHTML=''; drawThreads(); E.refreshChrome(); onChange&&onChange(); };
    ok.onclick=()=>{ if(existing){ existing.label=label; } else { E.S.links.push({a,b,label,ep:E.EP.id}); freshLink=E.S.links.length-1; } E.S.flags.boardHint=true; const bh=document.getElementById('bHint'); if(bh) bh.remove();
      E.save(); host.innerHTML=''; drawThreads(); E.refreshChrome(); onChange&&onChange(); };
  }
  board.querySelectorAll('.card').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clickCard(el); } }));
  board.addEventListener('click',e=>{ const t=e.target.closest('.tag'); if(!t) return; const L=E.S.links[+t.dataset.link]; openPop(L.a,L.b); });
  requestAnimationFrame(()=>{ applyZoom(); drawThreads(); }); setTimeout(()=>{ applyZoom(); drawThreads(); },80);
}
/* Контрольные точки эпизода запускаются с доски: выводы → версия дела → завершение */
E.checkpoint = function(){
  const P=E.P(), min=E.EP.board.minLinks, n=E.S.links.filter(l=>l.ep===E.EP.id).length;
  if(!E.gate.facts()){
    const allDone=E.EP.desk.items.filter(i=>i.required).every(i=>E.itemDone(i)), visDone=E.visibleReq().every(i=>E.itemDone(i));
    const text = allDone ? `Свяжи находки этого эпизода: нужно хотя бы ${min} новые нити. Сейчас: ${n}.`
      : visDone ? (n>=min ? 'Нити натянуты. Проверь стол — могло появиться что-то новое.' : `Разложи новые находки и свяжи их между собой: нужно хотя бы ${min} новые нити. Сейчас: ${n}.`)
      : 'Сначала изучи новые материалы на столе.';
    return { text, btn:'Проверить выводы', go:null }; }
  if(!P.facts.checked) return { text:'Находок достаточно. Отдели факты от предположений.', btn:'Проверить выводы →', go:'facts' };
  if(!P.version.done)  return { text:'Выводы сверены. Зафиксируй, во что ты сейчас веришь.', btn:'Зафиксировать версию дела →', go:'version' };
  if(E.EP.finale) return { text:'Версия дела зафиксирована. Осталось собрать выпуск для эфира.', btn:'Собрать выпуск →', go:'final' };
  return { text:'Версия дела зафиксирована — записка на доске.', btn:'Завершить эпизод →', go:'end' };
};
E.VIEWS.board = function(){
  if(!E.gate.board()) return E.go('desk');
  const cp=E.checkpoint();
  app().innerHTML=`<div class="head"><div><div class="label">Доска расследования · вся игра</div><h2>Во что ты веришь сейчас</h2></div>
    <div class="checkpoint"><span class="label">${esc(E.EP.short)} · контрольная точка</span><span id="cpText">${esc(cp.text)}</span><button class="btn primary" id="cpBtn" ${cp.go?'':'disabled'}>${esc(cp.btn)}</button></div></div>
    ${boardUI(true)}`;
  wireBoard(()=>{ const c=E.checkpoint(); document.getElementById('cpText').textContent=c.text; const bt=document.getElementById('cpBtn'); bt.textContent=c.btn; bt.disabled=!c.go; }, E.VIEWS.board);
  document.getElementById('cpBtn').onclick=()=>{ const c=E.checkpoint(); if(c.go) E.go(c.go); };
};

/* ---------- ФАКТ ИЛИ ПРЕДПОЛОЖЕНИЕ ---------- */
function factsBlock(host, list, store, opt){
  const draw=()=>{
    const checked=store.checked, done=checked&&list.every(f=>store.ans[f.id]===f.fact);
    host.innerHTML=`<div class="facts">${list.map(f=>{ const a=store.ans[f.id], wrong=checked&&a!==f.fact;
      return `<div class="fact ${checked&&!wrong?'good':''}"><div><div class="st">${esc(f.st)}</div><div class="src">источник: ${esc(f.src)}</div></div>
        <div class="seg" role="group"><button data-f="${f.id}" data-v="1" aria-pressed="${a===true}" ${done?'disabled':''}>Доказано материалами</button><button data-f="${f.id}" data-v="0" aria-pressed="${a===false}" ${done?'disabled':''}>Предположение</button></div>
        ${wrong?`<div class="why"><b>${f.fact?'Это уже подтверждено':'Вывод сильнее, чем позволяет улика'}</b>${esc(f.why)}</div>`:''}</div>`; }).join('')}</div>
      <div class="row" style="margin-top:16px">${done?`<span class="stamp big hit">${opt.fix?'Навык подтверждён':'Выводы сверены'}</span><button class="btn primary" id="fNext">${esc(opt.nextLabel)}</button>`
        : checked?`<button class="btn primary" id="fCheck">Сверить ещё раз</button>${opt.fix?'':'<button class="btn ghost" id="fLeave">Оставить как есть</button>'}`
        : `<button class="btn primary" id="fCheck">Сверить с материалами</button>`}</div><div id="fMiss"></div>`;
    host.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ store.ans[b.dataset.f]=b.dataset.v==='1'; E.save(); draw(); });
    const ch=host.querySelector('#fCheck'); if(ch) ch.onclick=()=>{
      const left=list.filter(f=>store.ans[f.id]==null).length;
      if(left){ host.querySelector('#fMiss').innerHTML=`<div class="fb" style="margin-top:12px"><h4>Ещё не всё</h4><p>Реши про каждое утверждение. Осталось: ${left}.</p></div>`; return; }
      list.forEach(f=>{ if(store.ans[f.id]!==f.fact) E.logLogic(f,store.ans[f.id],{fix:opt.fix}); }); store.checked=true;
      if(opt.fix && list.every(f=>store.ans[f.id]===f.fact)) E.S.archive.forEach(e=>{ if(opt.skills.includes(e.skill)) e.fixed=true; });
      E.save(); E.refreshChrome(); draw(); };
    const lv=host.querySelector('#fLeave'); if(lv) lv.onclick=opt.onNext;
    const nx=host.querySelector('#fNext'); if(nx) nx.onclick=opt.onNext;
  };
  draw();
}

/* ---------- АРХИВ ДЕЛА (все эпизоды, фильтр) ---------- */
const CAT={ '9':['c9','№9'], '16':['c16','№16'], 'rec':['crec','Запись речи'], 'log':['clog','Логика расследования'] };
const catPill=e=>`<span class="pill ${CAT[e.cat][0]}">${CAT[e.cat][1]} · ${esc(V16.SKILLS[e.skill].name)}</span>`;
E.fixDef = function(skill, preferEp){
  const order=[preferEp, ...V16.GAME.order].filter(Boolean);

/* =====================================================================
   ВЫПУСК-16 · ДВИЖОК · СЮЖЕТНЫЕ СОБЫТИЯ И НОВЫЕ ПРЕДМЕТЫ
   Скрытые триггеры с сообщениями, редакционный экземпляр, папка.
   ===================================================================== */
(function(){
"use strict";
const E=V16.engine, esc=E.esc;
const app = () => document.getElementById('app');

/* ---------- сюжетные триггеры ----------
   В данных эпизода: triggers:[{ id, when:{…}, set:'флаг', message:{from, text, action} }].
   Проверяются при каждом обновлении интерфейса. Срабатывают один раз (S.fired). */
E.checkTriggers = function(){
  if(!E.S || !E.S.fired) return;
  let fired=false;
  V16.GAME.order.filter(E.epUnlocked).forEach(ep=>{
    (V16.EPISODES[ep].triggers||[]).forEach(tr=>{
      if(E.S.fired[tr.id] || !E.whenOk(tr.when, ep)) return;
      E.S.fired[tr.id]=Date.now();
      if(tr.set) E.S.flags[tr.set]=true;
      if(tr.message){ E.S.inbox.push(Object.assign({id:tr.id, ep, t:Date.now(), read:false}, tr.message)); }
      fired=true;
    });
  });
  if(fired){ E.save(); E.showNotice(); }
};

/* ---------- уведомление-сообщение поверх рабочего места ---------- */
const notice=document.createElement('div'); notice.className='notice'; notice.hidden=true; notice.setAttribute('role','status');
E.showNotice = function(){
  const m=E.S.inbox.find(x=>!x.read); if(!m){ notice.hidden=true; return; }
  if(!notice.parentNode) document.body.appendChild(notice);
  notice.innerHTML=`<div class="n-top"><span class="label">новое сообщение</span><span class="mono">${esc(m.from)}</span></div>
    <p>${esc(m.text)}</p>
    <div class="row"><button class="btn primary small" id="nGo">${esc(m.action||'Посмотреть')}</button><button class="btn ghost small" id="nX">Позже</button></div>`;
  notice.hidden=false;
  const done=()=>{ m.read=true; E.save(); notice.hidden=true; };
  notice.querySelector('#nX').onclick=done;
  notice.querySelector('#nGo').onclick=()=>{ done(); if(m.go) E.go(m.go); else if(E.S.view==='desk') E.render(); else E.go('desk'); };
};

/* ---------- РЕДАКЦИОННЫЙ ЭКЗЕМПЛЯР: правки редактора → поля корректора → вычеркнутый абзац ---------- */
E.VIEWS.scene_editcopy = function(o){
  const U=E.S.ui, mats=E.objMats(o); const avail=i=> i===0 || E.matStatus(mats[i-1])!=='none';
  let cur=U.editEntry && mats.includes(U.editEntry) ? U.editEntry : (mats.find(m=>E.matStatus(m)==='none')||mats[mats.length-1]);
  if(!avail(mats.indexOf(cur))) cur=mats[0];
  const idx=mats.indexOf(cur), task=E.taskOfMat(cur), last=idx===mats.length-1;
  let paper='';
  if(task.type==='marks') paper=`<div class="paper editpaper"><div class="doc-title">Дом, который помнит</div><div class="mono" style="color:var(--ink-muted)">редакционный экземпляр · «Вечерний курьер»</div>
      <ol>${task.items.map(it=>`<li data-spot="${it.id}">${esc(it.before)}${it.edit==='added'?'<span class="redpen add">,</span>':it.edit==='struck'?'<span class="redpen strike">,</span>':','} ${esc(it.after)}<span class="redpen tick">${it.edit==='kept'?'✓':''}</span></li>`).join('')}</ol>
      <p class="margin-red">Лаврова: «проверить запятые!»</p></div>`;
  if(task.type==='rows') paper=`<div class="paper editpaper margin"><div class="mono" style="color:var(--ink-muted)">поля страницы · карандаш корректора</div><p class="hand" style="font-size:22px">сверить по словарю ↓</p></div>`;
  if(task.type==='letters') paper='';
  app().innerHTML=`<div class="head"><div>${E.backBtn('desk',E.backLabel())}<div class="label">От М. О. Лавровой · статья Лизы с правками</div><h2>${esc(o.title)}</h2></div>
    <div class="fragtabs">${mats.map((m,i)=>{ const t=E.taskOfMat(m); return `<button class="toggle" data-m="${m}" aria-pressed="${m===cur}" ${avail(i)?'':'disabled'}>${esc(t.tab||t.title)}${E.matStatus(m)==='confirmed'?' ✓':E.matStatus(m)==='draft'?' · черновик':''}</button>`; }).join('')}</div></div>
  <section class="scene ${task.type==='letters'?'single':''}">
    ${paper}
    <div class="${task.type==='letters'?'paper marker-paper':'card-box'}">${task.type==='letters'?'<div class="doc-title">Абзац, замазанный маркером</div>':''}<div id="taskHost"></div><div id="afterHost"></div></div>
  </section>`;
  E.wireBack(app());
  const again=()=>E.VIEWS.scene_editcopy(o);
  app().querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ U.editEntry=b.dataset.m; E.save(); again(); });
  const after=(host,anim,isDraft)=>{ if(last){ E.nextStepButton(host,anim,isDraft); return; }
    const b=document.createElement('div'); b.className='row'+(anim?' appear':''); b.style.marginTop='12px';
    b.innerHTML=`${isDraft?'<span class="draftnote">Оставлено черновиком.</span>':''}<button class="btn primary">Дальше: ${esc(E.taskOfMat(mats[idx+1]).tab)} →</button>`;
    b.querySelector('button').onclick=()=>{ U.editEntry=mats[idx+1]; E.save(); again(); }; host.appendChild(b); };
  E.runTask(task, document.getElementById('taskHost'), {
    light:task.type==='letters',
    onHl: hl => app().querySelectorAll('.editpaper li').forEach(li=>li.classList.toggle('hl', li.dataset.spot===hl)),
    afterDone:(fb,anim)=>{ if(task.type==='letters') { const n=document.createElement('div'); n.className='paper-note'+(anim?' appear':''); n.innerHTML='<b>Под маркером:</b> в 2011 году дом уже обследовали. Где это заключение?'; fb.appendChild(n); } after(fb,anim); },
    onLeave:again
  });
  if(E.matStatus(cur)==='draft') after(document.getElementById('afterHost'), false, true);
};

/* ---------- СТОПКА ТЕТРАДЕЙ: несколько документов по очереди (сочинения 11 «А») ----------
   marks — текст на листе слева, решения справа; остальные типы — прямо на листе. */
E.VIEWS.scene_stack = function(o){
  const U=E.S.ui, mats=E.objMats(o); const avail=i=> i===0 || E.matStatus(mats[i-1])!=='none';
  let cur=U.stackEntry && mats.includes(U.stackEntry) ? U.stackEntry : (mats.find(m=>E.matStatus(m)==='none')||mats[mats.length-1]);
  if(!avail(mats.indexOf(cur))) cur=mats[0];
  const idx=mats.indexOf(cur), task=E.taskOfMat(cur), last=idx===mats.length-1, onPaper=task.type!=='marks';
  const sheet=`<div class="doc-title">${esc(task.tab||task.title)}</div><div class="mono" style="color:var(--ink-muted);margin-bottom:12px">сочинение «Кем я хочу стать» · май 2016 · 11 «А»</div>`;
  const body = onPaper ? `<div class="paper essay">${sheet}<div id="taskHost"></div><div id="afterHost"></div></div>`
    : `<div class="paper essay">${sheet}<ol class="essay-lines">${task.items.map(it=>`<li data-spot="${it.id}">${esc(it.before)}${it.printed?',':''}${it.pencil?`<span class="pencil">${esc(it.pencil)}</span>`:''} ${esc(it.after)}</li>`).join('')}</ol></div>
       <div class="card-box"><div id="taskHost"></div><div id="afterHost"></div></div>`;
  app().innerHTML=`<div class="head"><div>${E.backBtn('desk',E.backLabel())}<div class="label">От Ирины Павловны · тетради 11 «А»</div><h2>${esc(o.title)}</h2></div>
    <div class="fragtabs">${mats.map((m,i)=>{ const t=E.taskOfMat(m); return `<button class="toggle" data-m="${m}" aria-pressed="${m===cur}" ${avail(i)?'':'disabled'}>${esc(t.tab||t.title)}${E.matStatus(m)==='confirmed'?' ✓':E.matStatus(m)==='draft'?' · черновик':''}</button>`; }).join('')}</div></div>
  <section class="scene ${onPaper?'single':''}">${body}</section>`;
  E.wireBack(app());
  const again=()=>E.VIEWS.scene_stack(o);
  app().querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ U.stackEntry=b.dataset.m; E.save(); again(); });
  const after=(host,anim,isDraft)=>{
    if(task.afterNote && !isDraft){ const n=document.createElement('div'); n.className='paper-note'+(anim?' appear':''); n.innerHTML=task.afterNote; host.appendChild(n); }
    if(last){ E.nextStepButton(host,anim,isDraft); return; }
    const b=document.createElement('div'); b.className='row'+(anim?' appear':''); b.style.marginTop='12px';
    b.innerHTML=`${isDraft?'<span class="draftnote">Оставлено черновиком.</span>':''}<button class="btn primary">Дальше: ${esc(E.taskOfMat(mats[idx+1]).tab)} →</button>`;
    b.querySelector('button').onclick=()=>{ U.stackEntry=mats[idx+1]; E.save(); again(); }; host.appendChild(b); };
  E.runTask(task, document.getElementById('taskHost'), {
    light:onPaper,
    onHl: hl => app().querySelectorAll('.essay-lines li').forEach(li=>li.classList.toggle('hl', li.dataset.spot===hl)),
    afterDone:(fb,anim)=>after(fb,anim),
    onLeave:again
  });
  if(E.matStatus(cur)==='draft') after(document.getElementById('afterHost'), false, true);
};

/* ---------- ПАПКА «ЛИЗА В.»: заметка газеты и копия письма (только чтение) ---------- */
E.VIEWS.scene_folder = function(o){
  const mats=E.objMats(o);
  app().innerHTML=`<div class="head"><div>${E.backBtn('desk',E.backLabel())}<div class="label">Архив «Вечернего курьера» · от М. О. Лавровой</div><h2>${esc(o.title)}</h2></div></div>
    <section class="folder">${mats.map(m=>`<div class="folder-item" id="f-${m}"></div>`).join('')}<div id="afterHost" class="folder-after"></div></section>`;
  E.wireBack(app());
  const draw=()=>{
    mats.forEach(m=>{ E.runTask(E.taskOfMat(m), document.getElementById('f-'+m), { onConfirm:draw }); });
    const host=document.getElementById('afterHost'); host.innerHTML='';
    if(mats.every(m=>E.matStatus(m)!=='none')) E.nextStepButton(host,false);
  };
  draw();
};
})();
/* =====================================================================
   ВЫПУСК-16 · ДВИЖОК · СБОРКА ВЫПУСКА, ЮРИСТ И КОНЦОВКИ
   Данные — EP.finale последнего эпизода (claims, decisions, endings, texts).
   Главный принцип: игрока оценивают по качеству итогового материала,
   а не по числу ошибок за игру.
   ===================================================================== */
(function(){
"use strict";
const E=V16.engine, esc=E.esc;
const app = () => document.getElementById('app');
const finaleEp = () => V16.GAME.order.map(id=>V16.EPISODES[id]).find(ep=>ep.finale);
const FS = () => { if(!E.S.final) E.S.final={ view:'build', claims:{}, decisions:{}, result:null, lawyer:null, attempts:0 }; return E.S.final; };
const matTitle = m => E.matDef(m).title;

/* ---------- юрист: смотрит только на то, что прозвучит в эфире ---------- */
E.lawyer = function(F, st){
  const reasons=[], notes=[], seen=new Set();
  const need = (m, topic) => { if(E.matStatus(m)==='confirmed' || seen.has(m)) return; seen.add(m);
    reasons.push({ kind:'draft', topic, mat:m,
      text: E.matStatus(m)==='draft' ? `Формулировка опирается на материал «${matTitle(m)}», а он оставлен черновиком. Непроверенный материал в эфир не идёт.`
                                     : `Формулировка опирается на материал «${matTitle(m)}», который ещё не изучен.` }); };
  F.claims.forEach(c=>{ const o=c.options.find(x=>x.id===st.claims[c.id]); if(!o) return;
    if(o.id==='over') reasons.push({ kind:'over', topic:c.topic, text:`«${o.text}» — формулировка сильнее, чем позволяют материалы. ${o.why}` });
    if(o.id==='under') notes.push({ topic:c.topic, text:`«${o.text}» — ${o.why}` });
    (o.needs||[]).forEach(m=>need(m, c.topic)); });
  F.decisions.forEach(d=>{ const v=st.decisions[d.id], req=d.requires&&d.requires[v]; if(!req) return;
    const bad=req.filter(m=>E.matStatus(m)!=='confirmed');
    if(bad.length) reasons.push({ kind:'require', topic:d.q, text:`${d.reqWhy} Не подтверждено: ${bad.map(m=>'«'+matTitle(m)+'»').join(', ')}.`, mats:bad }); });
  // Архив ошибок здесь намеренно не читается: важен только итоговый материал.
  return { verdict: reasons.length?'block':'pass', quality: reasons.length?null:(notes.length?'correct':'ideal'), reasons, notes };
};
function endingFor(F, st, law){
  const ok = w => !w || w.always || (w.lawyer && w.lawyer===law.verdict) || (w.decision && st.decisions[w.decision[0]]===w.decision[1])
    || (w.any && w.any.some(ok)) || (w.all && w.all.every(ok));
  return F.endings.find(en=>ok(en.when)).id;
}

/* ---------- карточка во вкладке «Выпуск» ---------- */
E.finaleCard = function(){
  const EP=finaleEp(); if(!EP) return '';
  const st=FS(), ready=E.S.eps[EP.id].version.done;
  if(!ready) return `<article class="vyp-sec locked-sec"><h3>Сборка выпуска</h3><p class="mono">Откроется в последнем эпизоде, когда версия дела будет зафиксирована.</p></article>`;
  const T=st.result && EP.finale.texts[st.result], Q=st.lawyer && st.lawyer.quality && EP.finale.quality[st.lawyer.quality];
  return `<article class="vyp-sec"><h3>Сборка выпуска</h3>
    <p>${T?`Последняя сборка: <b>${esc(T.title)}</b>${Q?' · '+esc(Q.title):''}.`:'Все материалы собраны. Осталось выбрать формулировки и отдать выпуск юристу.'}</p>
    <div class="row"><button class="btn primary" id="toFinal">${T?'Открыть сборку':'Собрать выпуск →'}</button></div></article>`;
};
document.addEventListener('click', e=>{ if(e.target && e.target.id==='toFinal') E.go('final'); });

/* ---------- экран сборки ---------- */
E.VIEWS.final = function(){
  const EP=finaleEp(); if(!EP || !E.S.eps[EP.id].version.done) return E.go('vypusk');
  if(E.EP.id!==EP.id) E.switchEp(EP.id);
  const F=EP.finale, st=FS();
  if(st.view==='result' && st.result) return result(EP, F, st);
  const missing = F.claims.filter(c=>!st.claims[c.id]).length + F.decisions.filter(d=>!st.decisions[d.id]).length;
  app().innerHTML=`<div class="head"><div>${E.backBtn('vypusk','К рабочей папке')}<div class="label">${esc(EP.short)} · финал</div><h1>Сборка выпуска №16</h1>
    <p class="lead" style="margin-top:10px">В эфир попадёт только то, что ты выберешь здесь. Юрист проверит каждую формулировку и материалы, на которые она опирается. Ошибки, которые ты делал и исправлял во время расследования, он не учитывает.</p></div></div>
  <section class="build">
    <div class="build-main">
      <article class="vyp-sec"><h3>Что прозвучит в эфире</h3><p class="mono">Для каждой темы выбери одну формулировку.</p>
        ${F.claims.map(c=>`<div class="bclaim"><div class="label">${esc(c.topic)}</div><div class="opts">${c.options.map(o=>`<button class="opt" data-c="${c.id}" data-o="${o.id}" aria-pressed="${st.claims[c.id]===o.id}">${esc(o.text)}</button>`).join('')}</div></div>`).join('')}
      </article>
      <article class="vyp-sec"><h3>Решения ведущего</h3>
        ${F.decisions.map(d=>`<div class="bclaim"><div class="label">${esc(d.q)}</div><div class="seg" role="group">${d.options.map(o=>`<button data-d="${d.id}" data-v="${o.id}" aria-pressed="${st.decisions[d.id]===o.id}">${esc(o.text)}</button>`).join('')}</div></div>`).join('')}
      </article>
      <div class="row"><button class="btn primary" id="toLawyer">Отдать выпуск юристу</button>${st.result?'<button class="btn ghost" id="toResult">К последнему заключению</button>':''}</div><div id="bMiss"></div>
    </div>
    <aside class="aside"><div class="lawyer"><div class="label" style="color:var(--ink-muted)">Как работает юрист</div><h3>Что проверяется</h3>
      <p>Нет ли ложных утверждений: не сильнее ли формулировка, чем позволяют материалы.</p><p>Нет ли неподтверждённых материалов среди тех, на которые она опирается.</p>
      <p class="mono" style="color:var(--ink-muted)">Не проверяется: сколько ошибок было за игру, сколько подсказок взято, что осталось в архиве.</p></div></aside>
  </section>`;
  E.wireBack(app());
  app().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ st.claims[b.dataset.c]=b.dataset.o; E.save(); E.VIEWS.final(); });
  app().querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ st.decisions[b.dataset.d]=b.dataset.v; E.save(); E.VIEWS.final(); });
  const tr=document.getElementById('toResult'); if(tr) tr.onclick=()=>{ st.view='result'; E.save(); E.VIEWS.final(); };
  document.getElementById('toLawyer').onclick=()=>{
    if(missing){ document.getElementById('bMiss').innerHTML=`<div class="fb" style="margin-top:12px"><h4>Ещё не всё</h4><p>Выбери формулировку для каждой темы и прими каждое решение. Осталось: ${missing}.</p></div>`; return; }
    const law=E.lawyer(F, st);
    st.lawyer=law; st.result=endingFor(F, st, law); st.view='result'; st.attempts=(st.attempts||0)+1; E.save(); window.scrollTo({top:0}); E.VIEWS.final();
  };
};

function result(EP, F, st){
  const law=st.lawyer, fresh=E.lawyer(F, st);                     // заключение хранится; если материалы с тех пор перепроверены — предлагаем отдать выпуск снова
  const changed = fresh.verdict!==law.verdict || fresh.reasons.length!==law.reasons.length;
  const T=F.texts[st.result], blocked=st.result==='blocked', Q=!blocked && law.quality && F.quality[law.quality];
  const aired = F.claims.map(c=>c.options.find(o=>o.id===st.claims[c.id])).filter(Boolean);
  const decs = F.decisions.map(d=>({d, o:d.options.find(o=>o.id===st.decisions[d.id])})).filter(x=>x.o);
  app().innerHTML=`<div class="head"><div>${E.backBtn('vypusk','К рабочей папке')}<div class="label">${esc(EP.short)} · заключение юриста · сборка ${st.attempts||1}</div><h1>${esc(T.title)}</h1>
    <p class="lead" style="margin-top:10px">${esc(T.lead)}</p></div></div>
  <section class="build">
    <div class="build-main">
      ${changed?`<div class="context appear"><span class="label" style="color:var(--amber)">материалы изменились</span><p>С прошлой проверки материалы перепроверены. Отдай выпуск юристу ещё раз.</p><button class="btn small primary" id="reLaw">Отдать юристу ещё раз</button></div>`:''}
      ${blocked?`<article class="vyp-sec"><h3>Почему выпуск не пропущен</h3><ul class="reasons">${law.reasons.map(r=>`<li class="reason"><span class="label">${esc(r.topic)}</span><p>${esc(r.text)}</p>
          ${r.mat?`<button class="btn small primary" data-mat="${r.mat}">Перепроверить исходный материал</button>`:''}${(r.mats||[]).map(m=>`<button class="btn small primary" data-mat="${m}">Перепроверить: ${esc(matTitle(m))}</button>`).join(' ')}</li>`).join('')}</ul>
        <p class="mono">Исправь формулировки или перепроверь материалы — и собери выпуск заново. Число ошибок за расследование не учитывается.</p></article>`
      :`<article class="vyp-sec"><h3>Что прозвучало в эфире</h3><ol class="aired">${aired.map(o=>`<li>${esc(o.text)}</li>`).join('')}</ol>
          <ul class="qs">${decs.map(x=>`<li><span class="mono">${esc(x.d.q)}</span> ${esc(x.o.text)}</li>`).join('')}</ul></article>
        <article class="vyp-sec after-air">${(T.paras||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
          ${T.voice?`<div class="vm-final"><button class="key" id="kVoice">▶ Прослушать голосовое</button><div class="vm-lines">${T.voice.map(l=>`<p>«${esc(l)}»</p>`).join('')}</div></div>`:''}
          ${T.why?`<p class="mono">${esc(T.why)}</p>`:''}</article>`}
      ${law.notes.length?`<article class="vyp-sec"><h3>Замечания юриста</h3><p class="mono">Не влияют ни на решение, ни на концовку: здесь можно было сказать точнее.</p><ul class="reasons">${law.notes.map(n=>`<li class="reason soft"><span class="label">${esc(n.topic)}</span><p>${esc(n.text)}</p></li>`).join('')}</ul></article>`:''}
      <div class="row"><button class="btn ${blocked?'primary':''}" id="rebuild">${blocked?'Изменить выпуск':'Пересобрать выпуск'}</button>
        <button class="btn" id="toErr">Разобрать ошибки</button><button class="btn" id="toFix">Исправить дело</button></div>
    </div>
    <aside class="aside"><div class="lawyer"><div class="label" style="color:var(--ink-muted)">Заключение</div><h3>${blocked?'В эфир нельзя':Q?esc(Q.title):'В эфир можно'}</h3>
      <p>${blocked?`Причин: ${law.reasons.length}. Каждую можно исправить.`:Q?esc(Q.text):'Всё сказанное подтверждено материалами.'}</p>
      <p class="mono" style="color:var(--ink-muted)">Юрист ищет ложные утверждения и неподтверждённые материалы. Красоту формулировок и число ошибок за игру он не оценивает.</p></div></aside>
  </section>`;
  E.wireBack(app());
  app().querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>E.openMaterial(b.dataset.mat));
  const rl=document.getElementById('reLaw'); if(rl) rl.onclick=()=>{ st.lawyer=fresh; st.result=endingFor(F, st, fresh); st.attempts=(st.attempts||0)+1; E.save(); E.VIEWS.final(); };
  document.getElementById('rebuild').onclick=()=>{ st.view='build'; E.save(); E.VIEWS.final(); };
  document.getElementById('toErr').onclick=()=>{ E.S.archiveTab='errors'; E.S.archiveFilter='all'; E.go('archive'); };
  document.getElementById('toFix').onclick=()=>{ E.S.archiveTab='fix'; E.S.archiveFilter='all'; E.go('archive'); };
  const kv=document.getElementById('kVoice'); if(kv) kv.onclick=async()=>{ kv.disabled=true;
    await E.playCues(T.voice.map(l=>({t:'say', voice:'f', pitch:.95, rate:.92, text:l, pause:600})), {rate:1, caption:()=>{}, level:()=>{}, noHiss:true});
    kv.disabled=false; };
}
})();
</script>
<script>V16.engine.boot();</script>
